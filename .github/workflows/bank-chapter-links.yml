name: Chapter link browser checks

on:
  pull_request:
    paths:
      - 'js/hub-*.js'
      - 'js/question-bank-tools.js'
      - 'public/pages/shared/subject-*.js'
      - 'public/shared/question-bank-menu.js'
      - 'scripts/test-question-bank-browser.mjs'
      - '.github/workflows/bank-chapter-links.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit && pnpm build
      - name: Install isolated browser test tools
        run: |
          npm install --prefix work/qa-tools --no-save --package-lock=false playwright@1.62.1
          node work/qa-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test production bank, chapter links, saved work and print
        env:
          QA_BUILT: '1'
        run: PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/qa-tools/node_modules/playwright" pnpm test:bank:browser
