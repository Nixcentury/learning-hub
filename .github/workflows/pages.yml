name: Learning Hub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test existing engines without live services
        run: pnpm test:unit
      # The validator emits file/line annotations and a Thai job summary.
      # Draft warnings exit successfully; malformed/unsafe content still fails.
      - name: Validate content (drafts allowed) and build Learning Hub
        env:
          CONTENT_VALIDATION_REPORT: ${{ runner.temp }}/content-validation-report.json
        run: pnpm build
      - name: Upload content validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-validation-report
          path: ${{ runner.temp }}/content-validation-report.json
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the complete Hub artifact
        id: deployment
        uses: actions/deploy-pages@v4
