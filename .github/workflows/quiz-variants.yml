name: AI practice browser checks

on:
  pull_request:
    paths:
      - 'js/companion*.js'
      - 'js/quiz-variant-preview.js'
      - 'js/app.js'
      - 'js/workspace.js'
      - 'css/companion.css'
      - 'public/shared/quiz-*'
      - 'public/pages/tools/quiz-player.html'
      - 'public/content/templates/ai-quiz-variant-template.txt'
      - 'scripts/*companion*'
      - 'scripts/*quiz-variant*'
      - '.github/workflows/quiz-variants.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit && pnpm build
      - name: Install isolated browser tools
        run: |
          npm install --prefix work/qa-tools --no-save --package-lock=false playwright@1.62.1
          node work/qa-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test production practice and existing companion
        env:
          QA_BUILT: '1'
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/qa-tools/node_modules/playwright"
          pnpm test:variant:browser
          pnpm test:companion:browser
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-practice-browser
          path: qa-output/quiz-variant-*.png
          if-no-files-found: ignore
