name: Wave 10.1 path and phase verification
on:
  pull_request:
    paths:
      - 'public/content/physics/ipst/wave-optics/10-1-wave-model-learning-sheet.html'
      - 'public/content/physics/ipst/wave-optics/assets/10-1/19-path-difference-far-screen.svg'
      - 'public/content/physics/ipst/wave-optics/assets/10-1/20-midpoint-screen-geometry.svg'
      - 'scripts/test-wave-path-phase-browser.mjs'
      - '.github/workflows/wave-path-phase-verify.yml'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install isolated browser tools
        run: |
          npm install --prefix work/qa-tools --no-save --package-lock=false playwright@1.62.1
          node work/qa-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check diagrams, equations and four A4 editions
        env:
          QA_BUILT: '1'
        run: PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/qa-tools/node_modules/playwright" node scripts/test-wave-path-phase-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wave-path-phase-evidence
          path: qa-output/wave-path-phase/
          if-no-files-found: ignore
