name: Workspace split view

on:
  pull_request:
    paths:
      - 'js/workspace.js'
      - 'js/simulation-progress*.js'
      - 'public/shared/wave-assessment-progress.js'
      - 'public/content/physics/ipst/wave-optics/assets/10-1-sim/**'
      - 'scripts/wave-assessment.test.mjs'
      - 'scripts/test-wave-visual-missions-browser.mjs'
      - 'css/styles.css'
      - 'css/learning-guide.css'
      - 'scripts/test-workspace-layout-browser.mjs'
      - 'scripts/test-topic-review-hub-browser.mjs'
      - 'public/shared/topic-review-page.js'
      - 'public/shared/quiz-core.js'
      - 'public/shared/quiz-core.css'
      - 'scripts/test-learning-sheet-browser.mjs'
      - '.github/workflows/workspace-layout.yml'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit && pnpm build
      - name: Install isolated browser tools
        run: |
          npm install --prefix work/qa-tools --no-save --package-lock=false playwright@1.62.1
          node work/qa-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify production windows and worksheet regressions
        env:
          QA_BUILT: '1'
        run: |
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/qa-tools/node_modules/playwright"
          export QA_BROWSER_EXECUTABLE="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          pnpm test:workspace:browser
          pnpm test:review:browser
          pnpm test:sheet:browser
      - name: Verify wave assessment questions, scores and saved drafts
        env:
          QA_BUILT: '1'
        run: |
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/work/qa-tools/node_modules/playwright"
          export QA_BROWSER_EXECUTABLE="$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')"
          pnpm test:assessment:browser
          node scripts/test-wave-mini-sim-browser.mjs
