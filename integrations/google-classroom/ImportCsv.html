<!doctype html>
<html lang="th"><head><meta charset="utf-8"><base target="_top"><style>
body{font:16px system-ui,sans-serif;margin:24px;color:#172a52}p{line-height:1.5}button{font:inherit;background:#172a52;color:white;border:0;border-radius:6px;padding:10px 18px;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}input{max-width:100%}
</style></head><body>
<p>เลือกไฟล์ <strong>hub-homework-….csv</strong> ที่ดาวน์โหลดจากหน้าคะแนนการบ้านใน Learning Hub</p>
<input id="file" type="file" accept=".csv,text/csv"><br>
<button id="import" type="button">นำเข้าไฟล์</button>
<p id="status" role="status">การนำเข้ายังไม่สร้างงานหรือส่งคะแนนเข้า Google Classroom</p>
<script>
const file = document.getElementById('file'), button = document.getElementById('import'), status = document.getElementById('status');
button.addEventListener('click', async () => {
  const selected = file.files[0];
  if (!selected || selected.size > 12000000) { status.textContent = 'เลือก CSV จาก Hub ขนาดไม่เกิน 12 MB'; return; }
  button.disabled = true; status.textContent = 'กำลังนำเข้า…';
  try {
    const csv = await selected.text();
    google.script.run.withSuccessHandler(message => {status.textContent = message; button.disabled = false;})
      .withFailureHandler(error => {status.textContent = 'นำเข้าไม่สำเร็จ: ' + error.message; button.disabled = false;}).hubImportCsv(csv);
  } catch (error) {status.textContent = 'อ่านไฟล์ไม่สำเร็จ: ' + error.message; button.disabled = false;}
});
</script></body></html>
