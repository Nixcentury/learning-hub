<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">Lewis connectivity diagrams of BH3 and PH3</title>
  <desc id="desc">BH3 has three B H single bonds and no lone pair at boron. PH3 has three P H single bonds and one lone pair at phosphorus. These are connectivity diagrams, not representations of three-dimensional molecular shape.</desc>
  <rect x="8" y="8" width="302" height="264" rx="12" fill="#f0f6ff" stroke="#b9cce7"/>
  <rect x="330" y="8" width="302" height="264" rx="12" fill="#f0f6ff" stroke="#b9cce7"/>
  <g stroke="#254665" stroke-width="3">
    <path d="M157 110V79 M136 137H100 M178 137H214"/>
    <path d="M479 110V79 M458 137H422 M500 137H536"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#193c65">
    <g font-size="22" font-weight="bold"><text x="157" y="42">BH₃</text><text x="479" y="42">PH₃</text></g>
    <g font-size="29" dominant-baseline="middle">
      <text x="157" y="138">B</text><text x="157" y="63">H</text><text x="79" y="138">H</text><text x="235" y="138">H</text>
      <text x="479" y="138">P</text><text x="479" y="63">H</text><text x="401" y="138">H</text><text x="557" y="138">H</text>
    </g>
    <g font-size="15" fill="#455c77"><text x="157" y="238">Connectivity only</text><text x="479" y="238">Connectivity only</text></g>
  </g>
  <g fill="#2563a6"><circle cx="473" cy="170" r="3.5"/><circle cx="485" cy="170" r="3.5"/></g>
</svg>
