<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-labelledby="title desc">
<title id="title">Chloride and boron trichloride</title><desc id="desc">A pair of dots on chloride is connected by a curved arrow to boron. The product is the BCl4 minus ion. Only the reacting lone pair is shown; the drawing is a connectivity schematic.</desc>
<defs><marker id="pair-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#83548d"/></marker></defs>
<g stroke="#34444c" stroke-width="2.2"><path d="M263 76V54 M283 96H303 M263 116V138 M520 76V54 M540 96H560 M520 116V138 M500 96H480" fill="none"/></g>
<g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#24343e"><text x="74" y="96">Cl</text><text x="96" y="72" font-size="18">−</text><text x="179" y="96">+</text><text x="263" y="96">B</text><text x="263" y="37">Cl</text><text x="323" y="96">Cl</text><text x="263" y="155">Cl</text><text x="392" y="96">⟶</text><text x="520" y="96">B</text><text x="520" y="37">Cl</text><text x="579" y="96">Cl</text><text x="520" y="155">Cl</text><text x="460" y="96">Cl</text><text x="622" y="23" font-size="18">−</text></g>
<circle cx="110" cy="90" r="2.7" fill="#83548d"/><circle cx="110" cy="100" r="2.7" fill="#83548d"/>
<path d="M113 87Q185 8 245 81" fill="none" stroke="#83548d" stroke-width="2.2" marker-end="url(#pair-arrow)"/>
<path d="M440 19H431V174H440 M602 19H611V174H602" fill="none" stroke="#34444c" stroke-width="2"/>
<text x="320" y="197" text-anchor="middle" font-size="14" font-family="Arial,sans-serif" fill="#52616a">Connectivity schematic; only the reacting lone pair is shown</text>
</svg>
