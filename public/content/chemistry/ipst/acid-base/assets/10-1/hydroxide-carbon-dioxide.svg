<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" role="img" aria-labelledby="title desc"><title id="title">Hydroxide and carbon dioxide</title><desc id="desc">The curved arrow begins at a lone pair on hydroxide oxygen and points towards the carbon of carbon dioxide. The product is hydrogen carbonate.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#83548d"/></marker></defs><g font-family="Arial,sans-serif" font-size="25" text-anchor="middle" dominant-baseline="middle" fill="#24343e"><text x="66" y="98">H—O</text><text x="108" y="76" font-size="19">−</text><text x="159" y="98">+</text><text x="262" y="98">O=C=O</text><text x="360" y="98">⟶</text><text x="493" y="98">[HO—C(=O)—O]⁻</text></g><circle cx="90" cy="83" r="2.7" fill="#83548d"/><circle cx="96" cy="86" r="2.7" fill="#83548d"/><path d="M96,79 Q175,10 257,78" fill="none" stroke="#83548d" stroke-width="2.2" marker-end="url(#arrow)"/><text x="411" y="140" font-size="15" font-family="Arial,sans-serif" fill="#52616a">new O—C bond</text></svg>