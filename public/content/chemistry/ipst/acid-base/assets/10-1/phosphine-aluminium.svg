<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="title desc"><title id="title">PH3 and AlCl3</title><desc id="desc">A curved arrow starts at the lone pair on PH3 and points towards the central atom of AlCl3. The product contains a new bond between these atoms.</desc><defs><marker id="pair-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#83548d"/></marker></defs><g stroke="#34444c" stroke-width="2.2"><line x1="95" y1="76" x2="95" y2="53"/><line x1="76" y1="96" x2="54" y2="96"/><line x1="95" y1="116" x2="95" y2="139"/><line x1="260" y1="76" x2="260" y2="53"/><line x1="284" y1="96" x2="298" y2="96"/><line x1="260" y1="116" x2="260" y2="139"/></g><g font-family="Arial,sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#24343e"><text x="95" y="96">P</text><text x="95" y="37">H</text><text x="37" y="96">H</text><text x="95" y="155">H</text><text x="260" y="96">Al</text><text x="260" y="37">Cl</text><text x="319" y="96">Cl</text><text x="260" y="155">Cl</text><text x="182" y="105">+</text><text x="392" y="96">⟶</text><text x="524" y="96" font-size="23">H₃P—AlCl₃</text></g><circle cx="117" cy="90" r="2.7" fill="#83548d"/><circle cx="117" cy="100" r="2.7" fill="#83548d"/><path d="M120,88 Q184,18 242,83" fill="none" stroke="#83548d" stroke-width="2.2" marker-end="url(#pair-arrow)"/><text x="470" y="140" font-size="15" font-family="Arial,sans-serif" fill="#52616a">new bond between P and Al</text></svg>