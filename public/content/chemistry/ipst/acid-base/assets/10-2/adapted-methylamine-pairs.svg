<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="270" viewBox="0 0 1120 270" role="img" aria-labelledby="title desc"><title id="title">Adapted practice · 1.1</title><desc id="desc">Conjugate connectors link the first substance with the third, and the second with the fourth.</desc><rect width="1120" height="270" fill="white"/><g font-family="Arial,sans-serif" fill="#20314b"><text x="145" y="123" text-anchor="middle" font-size="27">CH₃NH₂</text><text x="420" y="123" text-anchor="middle" font-size="27">H₂O</text><text x="700" y="123" text-anchor="middle" font-size="27">CH₃NH₃⁺</text><text x="975" y="123" text-anchor="middle" font-size="27">OH⁻</text><text x="282" y="123" font-size="25">+</text><text x="555" y="123" text-anchor="middle" font-size="30">⇌</text><text x="837" y="123" font-size="25">+</text><text x="418" y="32" text-anchor="middle" font-size="18">Pair 1 · one H⁺ difference</text><text x="696" y="242" text-anchor="middle" font-size="18">Pair 2 · one H⁺ difference</text></g><path d="M145 92 Q420 -9 700 92" fill="none" stroke="#426887" stroke-width="3"/><path d="M420 145 Q695 252 975 145" fill="none" stroke="#7c567f" stroke-width="3"/></svg>
