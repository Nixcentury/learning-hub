<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 245" role="img" aria-labelledby="title"><title id="title">One proton transfers from HF to water; no acid or base labels are supplied</title><rect width="950" height="245" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="145" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" fill="#303540">H—F</text><text x="360" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" fill="#303540">H₂O</text><text x="630" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" fill="#303540">F⁻</text><text x="835" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="42" fill="#303540">H₃O⁺</text><text x="255" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#303540">+</text><text x="500" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" fill="#303540">⇌</text><text x="730" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#303540">+</text><path d="M109 115C155 205 353 205 367 117" fill="none" stroke="#a3583b" stroke-width="3" marker-end="url(#arrow)"/><text x="238" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#a3583b">H⁺ transfer</text></svg>
