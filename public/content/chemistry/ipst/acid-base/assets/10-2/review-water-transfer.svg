<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="240" viewBox="0 0 1040 240" role="img" aria-labelledby="title desc"><title id="title">A proton moves between two labelled water molecules</title><desc id="desc">Water 2 donates one H plus to water 1. The labels identify distinct molecules and are not parts of their formulas.</desc><rect width="1040" height="240" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#3a5d79"/></marker></defs><g font-family="Arial,sans-serif" fill="#25384d" text-anchor="middle"><text x="230" y="142" font-size="42">H₂O</text><text x="810" y="142" font-size="42">H₂O</text><text x="230" y="187" font-size="23">(1)</text><text x="810" y="187" font-size="23">(2)</text><text x="520" y="35" font-size="27">H⁺</text></g><path d="M740 106 Q520 0 300 106" fill="none" stroke="#3a5d79" stroke-width="4" marker-end="url(#arrow)"/></svg>
