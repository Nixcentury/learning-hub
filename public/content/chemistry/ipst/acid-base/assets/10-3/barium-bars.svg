<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Barium hydroxide concentration bars</title><desc id="desc">One initial molar unit of dissolved barium hydroxide gives one molar unit of barium ions and two of hydroxide. Initial and final use one scale.</desc><rect width="900" height="350" fill="white"/><g font-family="Arial, sans-serif"><text x="450" y="29" font-size="25" text-anchor="middle" fill="#29313a" font-weight="bold">Ba(OH)₂ → Ba²⁺ + 2OH⁻</text><text x="53" y="62" font-size="18" text-anchor="start" fill="#29313a" font-weight="normal">mol/L</text><line x1="85" y1="275" x2="870" y2="275" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="281" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">0</text><line x1="85" y1="184" x2="870" y2="184" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="190" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">1</text><line x1="85" y1="93" x2="870" y2="93" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="99" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">2</text><line x1="85" y1="64" x2="85" y2="275" stroke="#657080" stroke-width="2"/><line x1="85" y1="275" x2="870" y2="275" stroke="#657080" stroke-width="2"/><rect x="165" y="184" width="90" height="91" fill="#85608e" stroke="none" rx="0"/><text x="210" y="174" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">1.0</text><text x="210" y="302" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">Ba(OH)₂</text><text x="210" y="333" font-size="19" text-anchor="middle" fill="#29313a" font-weight="normal">Initial</text><text x="405" y="217" font-size="39" text-anchor="middle" fill="#29313a" font-weight="normal">→</text><rect x="505" y="184" width="90" height="91" fill="#397bad" stroke="none" rx="0"/><text x="550" y="174" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">1.0</text><text x="550" y="302" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">Ba²⁺</text><rect x="715" y="93" width="90" height="182" fill="#b94f4f" stroke="none" rx="0"/><text x="760" y="83" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">2.0</text><text x="760" y="302" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">OH⁻</text><text x="655" y="333" font-size="19" text-anchor="middle" fill="#29313a" font-weight="normal">After dissociation</text></g></svg>
