<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc"><title id="title">Partial ionization concentration bars</title><desc id="desc">A hypothetical 1.00 mol per litre HA solution has 0.05 mol per litre ionized, leaving 0.95 HA and forming 0.05 each of hydronium and A-minus. All bars share one scale.</desc><rect width="900" height="350" fill="white"/><g font-family="Arial, sans-serif"><text x="450" y="29" font-size="25" text-anchor="middle" fill="#29313a" font-weight="bold">HA + H₂O ⇌ H₃O⁺ + A⁻</text><text x="40" y="61" font-size="18" text-anchor="start" fill="#29313a" font-weight="normal">mol/L</text><line x1="85" y1="270" x2="865" y2="270" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="276" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">0</text><line x1="85" y1="180.0" x2="865" y2="180.0" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="186.0" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">0.5</text><line x1="85" y1="90" x2="865" y2="90" stroke="#e5e5e8" stroke-width="2"/><text x="70" y="96" font-size="18" text-anchor="end" fill="#29313a" font-weight="normal">1</text><line x1="85" y1="63" x2="85" y2="270" stroke="#657080" stroke-width="2"/><line x1="85" y1="270" x2="865" y2="270" stroke="#657080" stroke-width="2"/><rect x="155" y="90" width="85" height="180" fill="#85608e" stroke="none" rx="0"/><text x="198" y="80" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">1.00</text><text x="198" y="300" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">HA</text><text x="198" y="331" font-size="19" text-anchor="middle" fill="#29313a" font-weight="normal">Initial</text><text x="345" y="195" font-size="39" text-anchor="middle" fill="#29313a" font-weight="normal">→</text><rect x="450" y="99" width="75" height="171" fill="#85608e" stroke="none" rx="0"/><text x="488" y="89" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">0.95</text><text x="488" y="300" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">HA</text><rect x="610" y="261" width="75" height="9" fill="#b94f4f" stroke="none" rx="0"/><text x="648" y="247" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">0.05</text><text x="648" y="300" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">H₃O⁺</text><rect x="770" y="261" width="75" height="9" fill="#397bad" stroke="none" rx="0"/><text x="808" y="247" font-size="20" text-anchor="middle" fill="#29313a" font-weight="normal">0.05</text><text x="808" y="300" font-size="21" text-anchor="middle" fill="#29313a" font-weight="normal">A⁻</text><text x="650" y="331" font-size="19" text-anchor="middle" fill="#29313a" font-weight="normal">At equilibrium</text></g></svg>
