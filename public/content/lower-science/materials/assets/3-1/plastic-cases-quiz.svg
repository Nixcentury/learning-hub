<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>Four product use-cases, not labelled by their material</title><desc>A flexible electrical cable, a transparent drink bottle, light cushioning packaging and a small non-stick pan. Labels K L M N identify cases, not materials.</desc><rect width="960" height="340" rx="18" fill="#f4faf9"/><g stroke="#cbdeda" fill="#fff" stroke-width="2"><rect x="20" y="35" width="218" height="273" rx="13"/><rect x="254" y="35" width="218" height="273" rx="13"/><rect x="488" y="35" width="218" height="273" rx="13"/><rect x="722" y="35" width="218" height="273" rx="13"/></g><g font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#325f68"><text x="128" y="73">K</text><text x="363" y="73">L</text><text x="597" y="73">M</text><text x="831" y="73">N</text></g><g stroke="#577a8a" stroke-width="7" fill="none" stroke-linecap="round"><path d="M56 130 Q125 86 190 172 T196 247"/><path d="M101 128 Q120 140 141 139" stroke="#d4a04e" stroke-width="9"/></g><g fill="#c7e8e3" stroke="#5796a2" stroke-width="5"><path d="M340 134 V112 H386 V134 Q396 145 396 159 V248 Q396 265 380 265 H347 Q330 265 330 248 V159 Q330 145 340 134Z"/><rect x="343" y="99" width="41" height="15" rx="3"/><path d="M557 152 H645 V250 H557Z" fill="#f3f4e7"/><path d="M557 184 H645 M570 151 V251 M625 151 V251" stroke-dasharray="4 8"/><ellipse cx="808" cy="186" rx="48" ry="21" fill="#657c81"/><path d="M853 188 L890 188" fill="none" stroke="#77736b" stroke-width="12"/></g><g fill="#476a74" font-family="Arial,sans-serif" font-size="16" text-anchor="middle"><text x="129" y="286">flexible cable</text><text x="363" y="286">drink bottle</text><text x="597" y="286">protective packaging</text><text x="831" y="286">coated pan</text></g></svg>