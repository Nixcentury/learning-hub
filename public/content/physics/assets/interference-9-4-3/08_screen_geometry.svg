<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 535"><rect width="1120" height="535" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#24324a}.t{font-size:24px;font-weight:600}.note{font-size:18px;fill:#617089}.sym{font-size:24px}</style><text x="27" y="38" class="t">Screen geometry: L, x, θ</text><line x1="960" y1="64" x2="960" y2="468" stroke="#607285" stroke-width="5"/><line x1="175" y1="345" x2="960" y2="345" stroke="#8e9aab" stroke-width="3"/><line x1="175" y1="345" x2="960" y2="135" stroke="#2c75ba" stroke-width="4"/><line x1="960" y1="345" x2="960" y2="135" stroke="#bf5043" stroke-width="4"/><path d="M 269 345 A 94 94 0 0 0 266 320" stroke="#bf5043" fill="none" stroke-width="4"/><path d="M 937 345 L 937 322 L 960 322" stroke="#607285" fill="none" stroke-width="2"/><text x="290" y="335" class="sym">θ</text><text x="555" y="381" class="sym">L</text><text x="982" y="253" class="sym">x</text><text x="137" y="367" class="sym">O</text><text x="982" y="348" class="sym">M</text><text x="984" y="138" class="sym">P</text><text x="410" y="490" class="note">sin θ = x / √(L² + x²)    ·    x ≪ L ⇒ sin θ ≈ x/L</text><circle cx="175" cy="345" r="7" fill="#263247"/><circle cx="960" cy="345" r="7" fill="#263247"/><circle cx="960" cy="135" r="7" fill="#263247"/></svg>