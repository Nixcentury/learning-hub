<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="cavity-title cavity-desc">
<title id="cavity-title">A cavity radiator with a small opening</title><desc id="cavity-desc">An incoming ray enters a small hole and undergoes multiple reflections. Heated cavity walls emit radiation; some radiation leaves through the opening.</desc>
