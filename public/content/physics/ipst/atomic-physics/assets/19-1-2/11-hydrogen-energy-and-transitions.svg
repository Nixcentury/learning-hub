<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="565" viewBox="0 0 1110 565"><defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker>
    <linearGradient id="spectrum"><stop offset="0" stop-color="#593c99"/><stop offset=".13" stop-color="#2556be"/><stop offset=".3" stop-color="#26a2a7"/><stop offset=".48" stop-color="#67b950"/><stop offset=".65" stop-color="#e0cc50"/><stop offset=".82" stop-color="#e78935"/><stop offset="1" stop-color="#a93636"/></linearGradient>
    </defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#23323b" font-size="19"><text x="25" y="38" font-size="25" font-weight="bold">Hydrogen energy levels and the same two-level transition</text><line x1="110" y1="425.0" x2="425" y2="425.0" stroke="#41574c" stroke-width="2"/><text x="105" y="431.0" text-anchor="end">n=1</text><text x="440" y="431.0" >-13.60 eV</text><line x1="110" y1="170.0" x2="425" y2="170.0" stroke="#41574c" stroke-width="2"/><text x="105" y="176.0" text-anchor="end">n=2</text><text x="440" y="176.0" >-3.40 eV</text><line x1="110" y1="122.77777777777777" x2="425" y2="122.77777777777777" stroke="#41574c" stroke-width="2"/><text x="105" y="128.77777777777777" text-anchor="end">n=3</text><text x="440" y="128.77777777777777" >-1.51 eV</text><line x1="110" y1="106.25" x2="425" y2="106.25" stroke="#aebbb4" stroke-width="2"/><line x1="110" y1="98.6" x2="425" y2="98.6" stroke="#aebbb4" stroke-width="2"/><line x1="110" y1="94.44444444444444" x2="425" y2="94.44444444444444" stroke="#aebbb4" stroke-width="2"/><line x1="110" y1="85" x2="425" y2="85" stroke="#4f6558" stroke-width="2" stroke-dasharray="7 5"/><text x="110" y="65" font-size="18">0 eV: free-electron threshold</text><text x="110" y="465" font-size="18">n=1: ground state</text><text x="110" y="493" font-size="18">n=2,3,...: excited bound states</text><line x1="325" y1="417.0" x2="325" y2="89" stroke="#626d80" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="346" y="291" font-size="17">ionization</text><text x="685" y="95" font-size="21" font-weight="bold">Zoom: n=2 and n=3</text><line x1="665" y1="185" x2="1030" y2="185" stroke="#41574c" stroke-width="2"/><text x="655" y="191" text-anchor="end">n=3</text><line x1="665" y1="360" x2="1030" y2="360" stroke="#41574c" stroke-width="2"/><text x="655" y="366" text-anchor="end">n=2</text><line x1="760" y1="352" x2="760" y2="193" stroke="#487663" stroke-width="3" marker-end="url(#arrow)"/><line x1="930" y1="193" x2="930" y2="352" stroke="#61577c" stroke-width="3" marker-end="url(#arrow)"/><text x="760" y="405" text-anchor="middle">absorb</text><text x="930" y="405" text-anchor="middle">emit</text><text x="845" y="450" text-anchor="middle">same energy gap</text><text x="845" y="481" text-anchor="middle">photon energy = |E3 - E2|</text><text x="25" y="540" font-size="16">Left: energy spacing to scale. Right: magnified gap. This is a model diagram, not an electron photograph.</text></g></svg>