<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Spectrum ruler measurement geometry</title><desc id="desc">O is the eye and grating. C is the tube at the ruler centre. P is the apparent spectral-line position. The right triangle has OC equal to D and CP equal to x. Theta at O is measured from the central normal.</desc><rect width="960" height="460" fill="#fff"/><g font-family="Arial,sans-serif" fill="#163d4e" font-size="21"><text x="30" y="36">Geometry for one spectral line</text><path d="M60 100H485" stroke="#627984" stroke-width="8"/><path d="M160 100V340H160L400 100Z" fill="#eef7fa" stroke="#487e96" stroke-width="3"/><path d="M160 130H190V100" fill="none" stroke="#487e96" stroke-width="2"/><path d="M160 274 A66 66 0 0 1 206.7 293.3" fill="none" stroke="#bd663b" stroke-width="3"/><text x="179" y="270">θ</text><circle cx="160" cy="100" r="7" fill="#b54840"/><circle cx="400" cy="100" r="7" fill="#c9653d"/><circle cx="160" cy="340" r="7" fill="#193f54"/><text x="110" y="76">C: tube</text><text x="354" y="76">P: line on ruler</text><path d="M160 150V305" stroke="#234e65" stroke-width="2"/><text x="124" y="232">D</text><path d="M180 120H380" stroke="#234e65" stroke-width="2"/><text x="277" y="148">x</text><text x="280" y="252">OP</text><text x="80" y="377">O: eye + grating</text><text x="42" y="414" font-size="18">OC is normal to the grating plane.</text><text x="42" y="440" font-size="18">OP is the viewing direction to the apparent line.</text><rect x="520" y="70" width="410" height="330" rx="12" fill="#f0f7f8" stroke="#b1ccd2"/><text x="544" y="111">Right-triangle relations</text><text x="544" y="161">OP² = D² + x²</text><text x="544" y="209">sin θ = x / OP</text><text x="544" y="257">tan θ = x / D</text><text x="544" y="313">Use the mean x̄ for two readings.</text><text x="544" y="353" font-size="18">D and x must use the same unit.</text><text x="544" y="382" font-size="18">No small-angle shortcut is required.</text></g></svg>