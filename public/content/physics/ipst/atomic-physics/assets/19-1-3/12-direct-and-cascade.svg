<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="505" viewBox="0 0 1060 505"><defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="context-stroke"/></marker>
    <linearGradient id="spectrum"><stop offset="0" stop-color="#593c99"/><stop offset=".13" stop-color="#2556be"/><stop offset=".3" stop-color="#26a2a7"/><stop offset=".48" stop-color="#67b950"/><stop offset=".65" stop-color="#e0cc50"/><stop offset=".82" stop-color="#e78935"/><stop offset="1" stop-color="#a93636"/></linearGradient>
    </defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#23323b" font-size="19"><text x="25" y="36" font-size="25" font-weight="bold">One direct drop or a two-step cascade</text><text x="65" y="75" font-size="22" font-weight="bold">A  Direct: 3 → 1</text><line x1="85" y1="113.33333333333333" x2="405" y2="113.33333333333333" stroke="#789084" stroke-width="2"/><text x="75" y="119.33333333333333" text-anchor="end" font-size="17">n=3</text><line x1="85" y1="155.0" x2="405" y2="155.0" stroke="#789084" stroke-width="2"/><text x="75" y="161.0" text-anchor="end" font-size="17">n=2</text><line x1="85" y1="380.0" x2="405" y2="380.0" stroke="#789084" stroke-width="2"/><text x="75" y="386.0" text-anchor="end" font-size="17">n=1</text><text x="565" y="75" font-size="22" font-weight="bold">B  Cascade: 3 → 2 → 1</text><line x1="585" y1="113.33333333333333" x2="905" y2="113.33333333333333" stroke="#789084" stroke-width="2"/><text x="575" y="119.33333333333333" text-anchor="end" font-size="17">n=3</text><line x1="585" y1="155.0" x2="905" y2="155.0" stroke="#789084" stroke-width="2"/><text x="575" y="161.0" text-anchor="end" font-size="17">n=2</text><line x1="585" y1="380.0" x2="905" y2="380.0" stroke="#789084" stroke-width="2"/><text x="575" y="386.0" text-anchor="end" font-size="17">n=1</text><line x1="240" y1="119.33333333333333" x2="240" y2="373.0" stroke="#487663" stroke-width="3" marker-end="url(#arrow)"/><text x="265" y="255" font-size="20">12.09 eV</text><text x="265" y="283" font-size="18">one photon</text><line x1="730" y1="116.33333333333333" x2="730" y2="152.0" stroke="#487663" stroke-width="3" marker-end="url(#arrow)"/><text x="775" y="111" font-size="18">1.89 eV</text><line x1="815" y1="160.0" x2="815" y2="373.0" stroke="#61577c" stroke-width="3" marker-end="url(#arrow)"/><text x="835" y="272" font-size="18">10.20 eV</text><text x="80" y="430" font-size="20">Total photon energy: 12.09 eV</text><text x="580" y="430" font-size="20">1.89 + 10.20 = 12.09 eV</text><text x="25" y="476" font-size="16">Illustrative routes in the level-only teaching model; energies rounded from En = -13.6/n² eV.</text></g></svg>