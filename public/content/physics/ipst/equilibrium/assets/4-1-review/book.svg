<path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
</marker>
</defs>
<path d="M 40 175 H 320" stroke="#83938f" stroke-width="3" />
<rect x="125" y="130" width="110" height="45" rx="4" fill="#f3f6f6" stroke="#273c51" stroke-width="2" />
