<line x1="180" y1="150" x2="180" y2="55" stroke="#273c51" stroke-width="3" stroke-linecap="round" marker-end="url(#book-th-arrow)" />
<circle cx="202" cy="53" r="13" fill="white" stroke="#273c51" stroke-width="1.4" />
<text x="202" y="58" text-anchor="middle" font-size="17" fill="#152c3b">1</text>
<line x1="180" y1="150" x2="180" y2="235" stroke="#273c51" stroke-width="3" stroke-linecap="round" marker-end="url(#book-th-arrow)" />
<circle cx="202" cy="232" r="13" fill="white" stroke="#273c51" stroke-width="1.4" />
<text x="202" y="237" text-anchor="middle" font-size="17" fill="#152c3b">2</text>
</svg>
