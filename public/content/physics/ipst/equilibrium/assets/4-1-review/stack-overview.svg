<svg font-family="Tahoma,Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="stack-overview-th-title">
<title id="stack-overview-th-title">Block A on block B; B is pulled right and both move together at constant velocity</title>
<defs>
<marker id="stack-overview-th-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
</marker>
</defs>
<path d="M 40 190 H 320" stroke="#83938f" stroke-width="3" />
<rect x="105" y="135" width="150" height="55" rx="4" fill="#f3f6f6" stroke="#273c51" stroke-width="2" />
<text x="180.0" y="167.5" text-anchor="middle" font-size="15" fill="#273c51">B</text>
<rect x="145" y="90" width="70" height="45" rx="4" fill="#f3f6f6" stroke="#273c51" stroke-width="2" />
<text x="180.0" y="117.5" text-anchor="middle" font-size="15" fill="#273c51">A</text>
<line x1="255" y1="160" x2="328" y2="160" stroke="#273c51" stroke-width="3" stroke-linecap="round" marker-end="url(#stack-overview-th-arrow)" />
<text x="298" y="143" text-anchor="middle" font-size="12" fill="#273c51">pull</text>
<line x1="240" y1="60" x2="320" y2="60" stroke="#39765f" stroke-width="3" stroke-linecap="round" marker-end="url(#stack-overview-th-arrow)" stroke-dasharray="7 5" />
<text x="275" y="40" text-anchor="middle" font-size="11" fill="#273c51">v constant</text>
</svg>
