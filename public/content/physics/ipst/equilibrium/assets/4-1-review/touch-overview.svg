<svg font-family="Tahoma,Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="touch-overview-th-title">
<title id="touch-overview-th-title">Two touching blocks pushed right at constant velocity</title>
<defs>
<marker id="touch-overview-th-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 Z" fill="context-stroke" />
</marker>
</defs>
<path d="M 40 180 H 320" stroke="#83938f" stroke-width="3" />
<rect x="105" y="130" width="65" height="50" rx="4" fill="#f3f6f6" stroke="#273c51" stroke-width="2" />
<text x="137.5" y="160.0" text-anchor="middle" font-size="15" fill="#273c51">A</text>
<rect x="170" y="130" width="65" height="50" rx="4" fill="#f3f6f6" stroke="#273c51" stroke-width="2" />
<text x="202.5" y="160.0" text-anchor="middle" font-size="15" fill="#273c51">B</text>
<line x1="40" y1="155" x2="103" y2="155" stroke="#273c51" stroke-width="3" stroke-linecap="round" marker-end="url(#touch-overview-th-arrow)" />
<text x="65" y="139" text-anchor="middle" font-size="12" fill="#273c51">push</text>
<line x1="270" y1="110" x2="325" y2="110" stroke="#39765f" stroke-width="3" stroke-linecap="round" marker-end="url(#touch-overview-th-arrow)" stroke-dasharray="7 5" />
<text x="285" y="91" text-anchor="middle" font-size="11" fill="#273c51">v constant</text>
</svg>
