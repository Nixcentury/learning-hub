<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Wave review diagram for drawing and labelling</title><desc id="desc">Use the surrounding learning-sheet instructions. The solution labels and curves have been omitted.</desc><style>text { font-family: DejaVu Sans, Arial, sans-serif; fill: #183449; }</style><rect width="1000" height="600" fill="white" /><text x="30.00" y="38.00" font-size="25" text-anchor="start" font-weight="bold" style="fill:#183449">Review: diffraction - change the wavelength</text><text x="245.00" y="100.00" font-size="20" text-anchor="middle" font-weight="bold" style="fill:#183449">Short wavelength</text><defs><clipPath id="c0"><rect x="12" y="139" width="445" height="312" /></clipPath></defs><g clip-path="url(#c0)"><path d="M102.000,139.000L102.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M76.000,139.000L76.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M50.000,139.000L50.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M24.000,139.000L24.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M24.000,295.000L110.000,295.000" stroke="#183449" stroke-width="1.7" fill="none" stroke-dasharray="" /><polygon points="110.00,295.00 99.00,291.00 99.00,299.00" fill="#183449" /><path d="M128.000,139.000L128.000,243.000" stroke="#183449" stroke-width="7" fill="none" stroke-dasharray="" /><path d="M128.000,347.000L128.000,451.000" stroke="#183449" stroke-width="7" fill="none" stroke-dasharray="" /></g><text x="23.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#183449">Incoming waves</text><text x="166.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#657789">Draw outgoing wavefronts</text><text x="745.00" y="100.00" font-size="20" text-anchor="middle" font-weight="bold" style="fill:#183449">Long wavelength</text><defs><clipPath id="c500"><rect x="512" y="139" width="445" height="312" /></clipPath></defs><g clip-path="url(#c500)"><path d="M576.000,139.000L576.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M524.000,139.000L524.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M524.000,295.000L610.000,295.000" stroke="#183449" stroke-width="1.7" fill="none" stroke-dasharray="" /><polygon points="610.00,295.00 599.00,291.00 599.00,299.00" fill="#183449" /><path d="M628.000,139.000L628.000,243.000" stroke="#183449" stroke-width="7" fill="none" stroke-dasharray="" /><path d="M628.000,347.000L628.000,451.000" stroke="#183449" stroke-width="7" fill="none" stroke-dasharray="" /></g><text x="523.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#183449">Incoming waves</text><text x="666.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#657789">Draw outgoing wavefronts</text><text x="40.00" y="555.00" font-size="21" text-anchor="start" font-weight="normal" style="fill:#657789">Same opening. Longer wavelength: _______________________</text><text x="40.00" y="586.00" font-size="16" text-anchor="start" font-weight="normal" style="fill:#183449">The incoming wavefront spacing changes; the opening width stays the same.</text></svg>