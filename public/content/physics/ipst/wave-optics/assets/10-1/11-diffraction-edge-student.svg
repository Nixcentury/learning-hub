<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc"><title id="title">Wave review diagram for drawing and labelling</title><desc id="desc">Use the surrounding learning-sheet instructions. The solution labels and curves have been omitted.</desc><style>text { font-family: DejaVu Sans, Arial, sans-serif; fill: #183449; }</style><rect width="1000" height="600" fill="white" /><text x="30.00" y="38.00" font-size="25" text-anchor="start" font-weight="bold" style="fill:#183449">Review: diffraction around an edge</text><text x="490.00" y="100.00" font-size="20" text-anchor="middle" font-weight="bold" style="fill:#183449">A wave can spread behind an edge</text><defs><clipPath id="c245"><rect x="257" y="139" width="445" height="312" /></clipPath></defs><g clip-path="url(#c245)"><rect x="373" y="295" width="312" height="156" rx="0" fill="#f1f3f5" stroke="none" /><path d="M321.000,139.000L321.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M269.000,139.000L269.000,451.000" stroke="#2166a5" stroke-width="2" fill="none" stroke-dasharray="" /><path d="M269.000,295.000L355.000,295.000" stroke="#183449" stroke-width="1.7" fill="none" stroke-dasharray="" /><polygon points="355.00,295.00 344.00,291.00 344.00,299.00" fill="#183449" /><path d="M373.000,295.000L373.000,451.000" stroke="#183449" stroke-width="7" fill="none" stroke-dasharray="" /></g><text x="268.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#183449">Incoming waves</text><text x="411.00" y="492.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#657789">Draw outgoing wavefronts</text><text x="483.00" y="430.00" font-size="15" text-anchor="start" font-weight="normal" style="fill:#657789">Geometrical shadow</text><text x="70.00" y="555.00" font-size="21" text-anchor="start" font-weight="normal" style="fill:#657789">Behind the edge, I predict: ______________________________</text><text x="70.00" y="586.00" font-size="17" text-anchor="start" font-weight="normal" style="fill:#183449">Explain using the wavefronts, not only straight rays.</text></svg>