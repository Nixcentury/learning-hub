<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" role="img" aria-labelledby="title desc"><title id="title">Short wavelength: wavefronts and spreading angle</title><desc id="desc">Same opening and same screen distance as the paired case. Opening width 2 model units; wavelength 0.5 model units. Line 1 is the forward axis. Line 2 runs from the same slit centre toward the first far-field dark band. Theta is the angle between these lines, not the curvature of a wavefront. The screen shows a normalised far-field pattern. Near-field wavefront sketch and distant screen are schematic, not to scale. Outgoing crests are omitted for the existing drawing exercise.</desc><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect width="500" height="550" fill="white"/><defs><clipPath id="field"><rect x="115" y="70" width="310" height="380"/></clipPath></defs><text x="250.00" y="31.00" font-size="25" fill="#203747" text-anchor="middle" font-weight="bold">Short wavelength</text><text x="250.00" y="58.00" font-size="17" fill="#536875" text-anchor="middle" font-weight="normal">Same slit width and screen distance</text><path d="M100.00,102.00 L100.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M88.00,102.00 L88.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M76.00,102.00 L76.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M64.00,102.00 L64.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M52.00,102.00 L52.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M40.00,102.00 L40.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><path d="M28.00,102.00 L28.00,418.00" fill="none" stroke="#397c94" stroke-width="1.6" stroke-dasharray=""/><g data-screen-pattern="far-field"><rect x="440" y="70" width="20" height="380" fill="#e9edef"/><defs><linearGr