<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="title desc">
<title id="title">Huygens construction for a plane wavefront</title>
<desc id="desc">Three representative points on the original front emit forward semicircular wavelets of radius v delta t. The new front is their common forward tangent, perpendicular to the direction of travel.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 8 4 0 8" fill="none" stroke="#23323b" stroke-width="1.3"/></marker></defs>
<rect width="620" height="420" fill="#fff"/>
<g fill="none" stroke="#7b9dbe" stroke-width="2">
<path d="M180 15 A90 90 0 0 1 180 195"/>
<path d="M180 115 A90 90 0 0 1 180 295"/>
<path d="M180 215 A90 90 0 0 1 180 395"/>
</g>
<path d="M180 15 V395" stroke="#566e7c" stroke-width="3"/>
<path d="M270 15 V395" stroke="#2e8067" stroke-width="4"/>
<g fill="#23323b"><circle cx="180" cy="105" r="4"/><circle cx="180" cy="205" r="4"/><circle cx="180" cy="305" r="4"/></g>
<g fill="none" stroke="#23323b" stroke-width="1.5">
<path d="M180 305 H270" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M350 205 H535" marker-end="url(#arrow)" stroke-width="2"/>
<path d="M155 45 H180"/><path d="M270 45 H315"/>
<path d="M270 205 H282 V217 H270"/>
</g>
<g font-family="Tahoma, sans-serif" font-size="22" fill="#23323b">
<text x="145" y="51" text-anchor="end">t</text>
<text x="325" y="51">t + Δt</text>
<text x="225" y="335" text-anchor="middle" font-size="19">r</text>
<text x="445" y="190" text-anchor="middle">v</text>
</g>
</svg>
