  <text x="43.000" y="180.000" font-size="24" fill="#1c2f46" text-anchor="end" font-weight="500">d</text>
  <path d="M 144.152 226.247 L 193.000 269.000 L 222.000 269.000" fill="none" stroke="#a6401e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <text x="233.000" y="275.000" font-size="24" fill="#a6401e" text-anchor="start" font-weight="650">S₂H = d sin θ</text>
