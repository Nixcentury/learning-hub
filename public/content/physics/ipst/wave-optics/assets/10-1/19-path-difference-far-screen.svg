  <marker id="dim-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 7 3.5 L 0 7" fill="none" stroke="#607487" stroke-width="1"/></marker>
</defs>
<rect width="600" height="324" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
