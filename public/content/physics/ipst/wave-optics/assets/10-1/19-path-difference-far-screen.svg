<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 324" role="img" aria-labelledby="title desc">
<title id="title">Path difference for a distant screen</title>
<desc id="desc">The two rays and the dashed midpoint direction MP are nearly parallel. H is the perpendicular foot from S1 to the lower ray. S2H is the extra distance in the parallel-ray construction. The angle at M is measured from axis MO.</desc>
