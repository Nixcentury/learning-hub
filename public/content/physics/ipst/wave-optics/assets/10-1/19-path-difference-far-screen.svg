  <path d="M 120.000 237.000 L 517.392 60.070" fill="none" stroke="#2c5987" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ray-arrow)"/>
  <path d="M 120.000 107.000 L 168.304 215.493" fill="none" stroke="#607487" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
