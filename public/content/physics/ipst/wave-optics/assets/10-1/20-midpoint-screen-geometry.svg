<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 355" role="img" aria-labelledby="title desc">
<title id="title">Angle and distances measured from the midpoint</title>
<desc id="desc">S1 and S2 are separated by d and meet the screen at P along the paths r1 and r2. M is their midpoint. MO is the perpendicular distance L to the screen, and OP is x. The dashed hypotenuse MP has length square root of L squared plus x squared.</desc>
<defs>
  <marker id="ray-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#2c5987"/></marker>
  <marker id="dim-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M 0 0 L 7 3.5 L 0 7" fill="none" stroke="#607487" stroke-width="1"/></marker>
</defs>
