<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 110" role="img" aria-label="Three diagrams: five fringe centres make four intervals, signed coordinates give separation, and a measured value is compared with theory">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1b3244} .head{font-size:15px;font-weight:700}.small{font-size:13px}.formula{font-size:15px;font-weight:700}.guide{stroke:#b8c8d2;stroke-width:1.2;stroke-dasharray:4 4}.axis{stroke:#526e7e;stroke-width:2} .bright{fill:#347999;stroke:#1f4559;stroke-width:1.5}.dark{fill:#fff;stroke:#a35033;stroke-width:3}.label{font-size:16px;font-weight:700}</style>
<rect x="1" y="1" width="958" height="108" rx="6" fill="#fff" stroke="#b4c5cf"/><line x1="320" y1="8" x2="320" y2="103" stroke="#d3dce1"/><line x1="640" y1="8" x2="640" y2="103" stroke="#d3dce1"/>
<text class="head" x="14" y="21">(13) N = 5</text><line class="axis" x1="30" y1="66" x2="298" y2="66"/>
<g class="bright"><rect x="47" y="49" width="7" height="32" rx="2"/><rect x="104" y="49" width="7" height="32" rx="2"/><rect x="161" y="49" width="7" height="32" rx="2"/><rect x="218" y="49" width="7" height="32" rx="2"/><rect x="275" y="49" width="7" height="32" rx="2"/></g>
<path d="M50 38 V31 H278 V38" fill="none" stroke="#286079" stroke-width="1.8"/><text x="164" y="27" text-anchor="middle" class="small">4 intervals</text>
<text x="50" y="100" text-anchor="middle" class="small">x_first</text><text x="278" y="100" text-anchor="middle" class="small">x_last</text>
<text class="head" x="332" y="21">(14) |x₂ − x₁|</text><line class="axis" x1="343" y1="63" x2="625" y2="63"/><path class="guide" d="M474 36 V86"/>
<circle cx="396" cy="63" r="6" fill="#af5737"/><circle cx="591" cy="63" r="6" fill="#277ba2"/><text x="396" y="85" text-anchor="middle" class="small">x₁ = −2</text><text x="474" y="85" text-anchor="middle" class="small">0</text><text x="591" y="85" text-anchor="middle" class="small">x₂ = +3</text><path d="M396 44 V37 H591 V44" stroke="#265a74" stroke-width="2" fill="none"/><text class="formula" x="487" y="34" text-anchor="middle">5 mm</text>
<text class="head" x="652" y="21">(15) measured vs theory</text><line x1="666" y1="78" x2="905" y2="78" stroke="#9cb1bf" stroke-width="2"/><rect x="701" y="43" width="35" height="35" fill="#d9e8ef" stroke="#53778b"/><rect x="765" y="41" width="35" height="37" fill="#74a9bd" stroke="#35667f"/><text class="small" x="719" y="94" text-anchor="middle">5.0</text><text class="small" x="781" y="94" text-anchor="middle">5.2</text><text class="formula" x="858" y="54" text-anchor="middle">4%</text><text class="small" x="858" y="72" text-anchor="middle">0.2 / 5.0</text><text class="small" x="858" y="90" text-anchor="middle">× 100</text>
</svg>