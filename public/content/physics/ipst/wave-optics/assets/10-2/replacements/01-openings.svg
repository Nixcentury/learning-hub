<rect x="190" y="130" width="30" height="150" fill="white" stroke="#253744" stroke-width="1"/>
<path d="M190 305L220 305" fill="none" stroke="#253744" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text id="text-4" x="205" y="338" font-size="22" text-anchor="middle" font-weight="normal">a</text>
<rect x="450" y="110" width="290" height="190" fill="#f3f5f6" stroke="#253744" stroke-width="1"/>
<rect x="510" y="130" width="30" height="150" fill="white" stroke="#253744" stroke-width="1"/>
<path d="M525 100L525 290" fill="none" stroke="#687b86" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="625" y="130" width="30" height="150" fill="white" stroke="#253744" stroke-width="1"/>
<path d="M640 100L640 290" fill="none" stroke="#687b86" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M525 120L640 120" fill="none" stroke="#253744" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
