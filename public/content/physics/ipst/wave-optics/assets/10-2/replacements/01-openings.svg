<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Single and double slit front views</title><desc id="desc">Two original front-view diagrams. a is each opening width; d is centre-to-centre separation, not edge gap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253744"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#172c3b">
<text id="text-1" x="400.0" y="34" font-size="24" text-anchor="middle" font-weight="bold">Front view: opening width a and separation d</text>
<text id="text-2" x="205" y="81" font-size="21" text-anchor="middle" font-weight="normal">One opening</text>
<text id="text-3" x="595" y="81" font-size="21" text-anchor="middle" font-weight="normal">Two openings</text>
