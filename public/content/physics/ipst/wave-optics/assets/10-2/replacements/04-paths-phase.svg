<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Two paths to one point</title><desc id="desc">Paths r1 and r2 begin at in-phase sources U and V and end at the same point P. Their absolute difference determines the additional phase difference.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#253744"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif" fill="#172c3b">
<text id="text-1" x="400.0" y="34" font-size="24" text-anchor="middle" font-weight="bold">Compare two paths to the same point</text>
<path d="M150 100L150 295" fill="none" stroke="#253744" stroke-width="4"/>
<path d="M650 70L650 305" fill="none" stroke="#253744" stroke-width="4"/>
<circle cx="150" cy="145" r="4"/>
<circle cx="150" cy="255" r="4"/>
<circle cx="650" cy="115" r="4"/>
<path d="M150 145L650 115" fill="none" stroke="#253744" stroke-width="2"/>
<path d="M150 255L650 115" fill="none" stroke="#253744" stroke-width="2"/>
<text id="text-2" x="125" y="152" font-size="22" text-anchor="end" font-weight="normal">U</text>
<text id="text-3" x="125" y="262" font-size="22" text-anchor="end" font-weight="normal">V</text>
<text id="text-4" x="671" y="122" font-size="22" text-anchor="start" font-weight="normal">P</text>
<text id="text-5" x="395" y="111" font-size="20" text-anchor="middle" font-weight="normal">r₁ = UP</text>
<text id="text-6" x="405" y="217" font-size="20" text-anchor="middle" font-weight="normal">r₂ = VP</text>
<text id="text-7" x="150" y="328" font-size="18" text-anchor="middle" font-weight="normal">Same initial phase</text>
<text id="text-8" x="530" y="290" font-size="25" text-anchor="middle" font-weight="normal">Δr = |r₁ − r₂|</text>
<text id="text-9" x="530" y="331" font-size="25" text-anchor="middle" font-weight="normal">Δφ = 2π Δr / λ</text>
<text id="text-10" x="400.0" y="374" font-size="16" text-anchor="middle" font-weight="normal">Schematic geometry. Paths must end at the same point; lengths are not to scale.</text>
</g></svg>