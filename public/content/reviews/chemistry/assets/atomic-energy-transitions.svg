<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250"><title>Absorption raises electron energy; emission lowers it</title><rect width="640" height="250" fill="white"/><defs><marker id="up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a76724"/></marker><marker id="down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#225e99"/></marker></defs><g font-family="Arial,sans-serif" fill="#20344e" font-size="22"><text x="320" y="29" text-anchor="middle" font-weight="bold">Discrete energy levels (schematic)</text><path d="M70 216V53" stroke="#20344e" stroke-width="2"/><path d="M65 63L70 53L75 63" fill="none" stroke="#20344e" stroke-width="2"/><text x="20" y="140" font-size="20" transform="rotate(-90 20 140)">Energy</text><g stroke="#8499b1" stroke-width="2"><path d="M115 210H570"/><path d="M115 120H570"/><path d="M115 80H570"/></g><text x="578" y="217">n=1</text><text x="578" y="127">n=2</text><text x="578" y="87">n=3</text><path d="M240 202V88" stroke="#a76724" stroke-width="3" marker-end="url(#up)"/><path d="M450 85V112" stroke="#225e99" stroke-width="3" marker-end="url(#down)"/><text x="240" y="240" text-anchor="middle" fill="#8a531b">Absorb</text><text x="440" y="167" text-anchor="middle" fill="#225e99">Emit</text></g></svg>