<svg xmlns="http://www.w3.org/2000/svg" width="660" height="510" viewBox="0 0 660 510" role="img" aria-labelledby="title desc"><title id="title">Aromatic rings and side-chain bonds</title><desc id="desc">Methylbenzene has an aromatic ring plus a methyl group. Ethenylbenzene also has an alkene outside the ring; a dashed box marks that side-chain double bond.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><text x="330" y="32" text-anchor="middle" font-size="23" font-weight="bold">Read the aromatic ring and side chain separately</text><path d="M195.0,140.0 L162.5,196.3 L97.5,196.3 L65.0,140.0 L97.5,83.7 L162.5,83.7 Z" fill="none" stroke="#152e47" stroke-width="3"/><path d="M182.0,140.0 L156.0,185.0" stroke="#152e47" stroke-width="3"/><path d="M104.0,185.0 L78.0,140.0" stroke="#152e47" stroke-width="3"/><path d="M104.0,95.0 L156.0,95.0" stroke="#152e47" stroke-width="3"/><path d="M195.0,355.0 L162.5,411.3 L97.5,411.3 L65.0,355.0 L97.5,298.7 L162.5,298.7 Z" fill="none" stroke="#152e47" stroke-width="3"/><path d="M182.0,355.0 L156.0,400.0" stroke="#152e47" stroke-width="3"/><path d="M104.0,400.0 L78.0,355.0" stroke="#152e47" stroke-width="3"/><path d="M104.0,310.0 L156.0,310.0" stroke="#152e47" stroke-width="3"/><path d="M195 140H251 M195 355H226" stroke="#152e47" stroke-width="3"/>
