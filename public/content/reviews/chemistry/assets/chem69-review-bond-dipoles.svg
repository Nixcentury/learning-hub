<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc"><title id="title">Adding two equal bond dipoles</title><desc id="desc">Two opposite bond dipole arrows cancel in a linear arrangement. In a bent arrangement their sideways components cancel while their upward components add. This is a conceptual diagram without specified bond angles.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#254e77"/></marker><marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#111"/></marker></defs><rect width="640" height="540" rx="16" fill="white"/><g font-family="Arial,sans-serif" fill="#183451" text-anchor="middle"><text x="320" y="36" font-size="25" font-weight="bold">Bond dipoles: add directions</text><text x="320" y="72" font-size="21">Equal and opposite → sum = 0</text><g stroke="#555" stroke-width="4"><path d="M160 134H480"/></g><g fill="#eff4f8" stroke="#555" stroke-width="2"><circle cx="160" cy="134" r="24"/><circle cx="320" cy="134" r="24"/><circle cx="480" cy="134" r="24"/></g><g font-size="24"><text x="160" y="142">X</text><text x="320" y="142">A</text><text x="480" y="142">X</text></g><g stroke="#254e77" stroke-width="4" marker-end="url(#arrow)"><path d="M286 100H202"/><path d="M354 100H438"/></g><text x="320" y="196" font-size="22">Two polar bonds can cancel.</text><path d="M38 225H602" stroke="#b5c3d1"/><text x="320" y="268" font-size="21">Equal, but not opposite → sum ≠ 0</text><path d="M210 320L320 430L430 320" stroke="#555" stroke-width="4" fill="none"/><g fill="#eff4f8" stroke="#555" stroke-width="2"><circle cx="210" cy="320" r="24"/><circle cx="320" cy="430" r="24"/><circle cx="430" cy="320" r="24"/></g><g font-size="24"><text x="210" y="328">X</text><text x="320" y="438">A</text><text x="430" y="328">X</text></g><g stroke="#254e77" stroke-width="4" marker-end="url(#arrow)"><path d="M285 383L240 338"/><path d="M355 383L400 338"/></g><path d="M320 394V318" stroke="#111" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#net)"/><text x="320" y="302" font-size="20">net</text><text x="320" y="494" font-size="20">Arrows: bond dipoles toward X</text><text x="320" y="522" font-size="18">Conceptual diagram · bond angles not to scale</text></g></svg>