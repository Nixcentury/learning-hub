<svg xmlns="http://www.w3.org/2000/svg" width="660" height="445" viewBox="0 0 660 445" role="img" aria-labelledby="title desc"><title id="title">Numbering a substituted cycloheptene</title><desc id="desc">The same seven-membered ring gives methyl locants 3,5 or 5,7. Both numberings assign double-bond carbons 1 and 2.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><text x="330" y="29" text-anchor="middle" font-size="24" font-weight="bold">Same structure • two numbering choices</text><path d="M119.4,83.0 L202.7,84.0 L253.9,149.8 L234.3,230.8 L158.8,266.0 L84.2,228.9 L66.7,147.5 Z" fill="none" stroke="#152e47" stroke-width="3"/><path d="M124.3,93.4 L197.6,94.3" stroke="#152e47" stroke-width="3"/><text x="130.0" y="111.6" text-anchor="middle" font-size="21" font-weight="bold">1</text><text x="191.6" y="112.4" text-anchor="middle" font-size="21" font-weight="bold">2</text><text x="229.5" y="161.1" text-anchor="middle" font-size="21" font-weight="bold">3</text><path d="M253.9,149.8 L282.0,143.7" stroke="#152e47" stroke-width="3"/><text x="302.7" y="146.3" text-anchor="middle" font-size="23">CH₃</text><text x="215.0" y="221.0" text-anchor="middle" font-size="21" font-weight="bold">4</text><text x="159.1" y="247.0" text-anchor="middle" font-size="21" font-weight="bold">5</text><path d="M158.8,266.0 L158.4,294.8" stroke="#152e47" stroke-width="3"/><text x="158.2" y="322.9" text-anchor="middle" font-size="23">CH₃</text><text x="103.9" y="219.6" text-anchor="middle" font-size="21" font-weight="bold">6</text><text x="90.9" y="159.3" text-anchor="middle" font-size="21" font-weight="bold">7</text><text x="160.0" y="375" text-anchor="middle" font-size="24" font-weight="bold">Locants: (3,5)</text><path d="M429.4,83.0 L512.7,84.0 L563.9,149.8 L544.3,230.8 L468.8,266.0 L394.2,228.9 L376.7,147.5 Z" fill="none" stroke="#152e47" stroke-width="3"/><path d="M434.3,93.4 L507.6,94.3" stroke="#152e47" stroke-width="3"/><text x="440.0" y="111.6" text-anchor="middle" font-size="21" font-weight="bold">2</text><text x="501.6" y="112.4" text-anchor="middle" font-size="21" font-weight="bold">1</text><text x="539.5" y="161.1" text-anchor="middle" font-size="21" font-weight="bold">7</text><path d="M563.9,149.8 L592.0,143.7" stroke="#152e47" stroke-width="3"/><text x="612.7" y="146.3" text-anchor="middle" font-size="23">CH₃</text><text x="525.0" y="221.0" text-anchor="middle" font-size="21" font-weight="bold">6</text><text x="469.1" y="247.0" text-anchor="middle" font-size="21" font-weight="bold">5</text><path d="M468.8,266.0 L468.4,294.8" stroke="#152e47" stroke-width="3"/><text x="468.2" y="322.9" text-anchor="middle" font-size="23">CH₃</text><text x="413.9" y="219.6" text-anchor="middle" font-size="21" font-weight="bold">4</text><text x="400.9" y="159.3" text-anchor="middle" font-size="21" font-weight="bold">3</text><text x="470.0" y="375" text-anchor="middle" font-size="24" font-weight="bold">Locants: (5,7)</text><text x="330" y="420" text-anchor="middle" font-size="20">Keep the double bond at 1–2. Compare the first difference.</text></g></svg>
