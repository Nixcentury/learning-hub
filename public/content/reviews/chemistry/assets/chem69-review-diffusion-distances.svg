<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" role="img" aria-labelledby="title desc"><title id="title">Two distances in a diffusion tube</title><desc id="desc">P starts at the left, Q at the right. The meeting point is x from the left and L minus x from the right. Schematic, not to scale.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#152e47"/></marker></defs>
<text x="330" y="33" font-size="23" text-anchor="middle" font-weight="bold">Same release time • same meeting time</text>
<rect x="48" y="85" width="564" height="72" rx="13" fill="#f3f6f8" stroke="#152e47" stroke-width="3"/>
<rect x="51" y="89" width="22" height="64" fill="#d9dfe4" stroke="#152e47"/>
<rect x="587" y="89" width="22" height="64" fill="#d9dfe4" stroke="#152e47"/>
<path d="M414 85V157 M421 85V157" stroke="#152e47" stroke-width="3"/>
<text x="92" y="128" font-size="24" font-weight="bold">P</text><text x="553" y="128" font-size="24" font-weight="bold">Q</text>
<text x="418" y="66" text-anchor="middle" font-size="20">Meeting point</text>
<path d="M82 192H411" fill="none" stroke="#152e47" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M427 192H578" fill="none" stroke="#152e47" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><path d="M82 258H578" fill="none" stroke="#152e47" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="245" y="223" font-size="24" text-anchor="middle">dP = x</text><text x="506" y="223" font-size="24" text-anchor="middle">dQ = L − x</text>
<text x="330" y="291" font-size="24" text-anchor="middle">Total length = L</text>
<text x="330" y="329" font-size="19" text-anchor="middle">dP + dQ = L • schematic, not to scale</text></g></svg>
