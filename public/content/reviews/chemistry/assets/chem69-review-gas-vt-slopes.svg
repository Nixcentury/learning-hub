<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Model gas volume versus Celsius temperature</title><desc id="desc">State A has n over P equal to 0.050 mol per atmosphere and state B has 0.100. B has twice A's slope. Both ideal model lines extrapolate to zero volume at minus 273.15 Celsius. Each line has fixed amount and pressure.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs><rect width="640" height="450" rx="16" fill="white"/><g font-family="Arial,sans-serif" fill="#183451"><text x="320" y="29" text-anchor="middle" font-size="23" font-weight="bold">V–T model: fixed n and P on each line</text><text x="320" y="59" text-anchor="middle" font-size="20">n/P: A = 0.050; B = 0.100 mol/atm</text><path d="M88 286H575" stroke="#e2e7ee"/><text x="288.057" y="293" text-anchor="end" font-size="19">1</text><path d="M88 232H575" stroke="#e2e7ee"/><text x="288.057" y="239" text-anchor="end" font-size="19">2</text><path d="M88 178H575" stroke="#e2e7ee"/><text x="288.057" y="185" text-anchor="end" font-size="19">3</text><path d="M88 124H575" stroke="#e2e7ee"/><text x="288.057" y="131" text-anchor="end" font-size="19">4</text><path d="M88 70H575" stroke="#e2e7ee"/><text x="288.057" y="77" text-anchor="end" font-size="19">5</text><path d="M60 340H596M303.057 350V77" stroke="#222" stroke-width="2.5" fill="none" marker-end="url(#tip)"/><path d="M90.0 335V346" stroke="#222"/><text x="90.0" y="373" font-size="20" text-anchor="middle">−273.15</text><path d="M303.057 335V346" stroke="#222"/><text x="303.057" y="373" font-size="20" text-anchor="middle">0</text><path d="M537.057 335V346" stroke="#222"/><text x="537.057" y="373" font-size="20" text-anchor="middle">300</text><path d="M90.0 340L303.057 279.52459" fill="none" stroke="#254e77" stroke-width="3" stroke-dasharray="7 6"/><path d="M303.057 279.52459L537.057 213.10458999999997" fill="none" stroke="#254e77" stroke-width="3.5"/><text x="550.057" y="218.10458999999997" font-size="24" font-weight="bold">A</text><path d="M90.0 340L303.057 219.04918" fill="none" stroke="#222222" stroke-width="3" stroke-dasharray="7 6"/><path d="M303.057 219.04918L537.057 86.20917999999998" fill="none" stroke="#222222" stroke-width="3.5"/><text x="550.057" y="91.20917999999998" font-size="24" font-weight="bold">B</text><text x="316.057" y="91" font-size="22">V (L)</text><text x="530" y="409" text-anchor="middle" font-size="22">t (°C)</text><text x="320" y="438" text-anchor="middle" font-size="18">Dashed lines: extrapolation of the ideal model</text></g></svg>