<svg xmlns="http://www.w3.org/2000/svg" width="660" height="520" viewBox="0 0 660 520" role="img" aria-labelledby="title desc"><title id="title">Compare moles divided by coefficients</title><desc id="desc">FeCl3 provides 0.300 mol per coefficient one; NaOH provides 0.600 divided by three, or 0.200 mol. The smaller value limits Fe(OH)3 to 0.200 mol, or 21.4 grams.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#152e47"/></marker></defs>
<text x="330" y="32" text-anchor="middle" font-size="24" font-weight="bold">Compare moles per coefficient</text>
<rect x="20" y="68" width="300" height="145" rx="6" fill="white" stroke="#9aa9b8"/><rect x="340" y="68" width="300" height="145" rx="6" fill="#f3f6f8" stroke="#152e47" stroke-width="3"/>
<text x="170" y="106" text-anchor="middle" font-size="28">FeCl₃</text><text x="490" y="106" text-anchor="middle" font-size="28">NaOH</text>
<text x="170" y="147" text-anchor="middle" font-size="23">0.300 mol ÷ 1</text><text x="490" y="147" text-anchor="middle" font-size="23">0.600 mol ÷ 3</text>
<text x="170" y="189" text-anchor="middle" font-size="25">0.300 mol</text><text x="490" y="189" text-anchor="middle" font-size="25" font-weight="bold">0.200 mol • smaller</text>
<path d="M330 235V280" stroke="#152e47" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="316" text-anchor="middle" font-size="25">k = 0.200 mol</text>
<rect x="35" y="344" width="590" height="115" rx="6" fill="#f3f6f8" stroke="#152e47"/>
<text x="330" y="379" text-anchor="middle" font-size="25">Fe(OH)₃ coefficient = 1</text>
<text x="330" y="413" text-anchor="middle" font-size="24">n = 1k = 0.200 mol</text>
<text x="330" y="444" text-anchor="middle" font-size="22">m = 0.200 × 107 = 21.4 g</text>
<text x="330" y="496" text-anchor="middle" font-size="19">Use the product coefficient after choosing the minimum.</text></g></svg>
