<svg xmlns="http://www.w3.org/2000/svg" width="660" height="710" viewBox="0 0 660 710" role="img" aria-labelledby="title desc"><title id="title">Three distinct polymer-chain architectures</title><desc id="desc">I shows separate linear chains with small pendant X groups. II has a branch made of polymer segments. III has multiple covalent bridges between chains. Circles are schematic chain segments, not atoms.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><text x="330" y="31" text-anchor="middle" font-size="24" font-weight="bold">Side group ≠ polymer arm ≠ crosslink</text><text x="24" y="94" font-size="25" font-weight="bold">I</text><path d="M180,100H540" stroke="#152e47" stroke-width="3"/><circle cx="180" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="225" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="270" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="315" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="360" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="405" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="450" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="495" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="540" cy="100" r="8" fill="white" stroke="#152e47" stroke-width="2"/><path d="M180,175H540" stroke="#152e47" stroke-width="3"/><circle cx="180" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="225" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="270" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="315" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="360" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="405" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="450" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="495" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="540" cy="175" r="8" fill="white" stroke="#152e47" stroke-width="2"/><path d="M225 100V66" stroke="#152e47" stroke-width="2"/><rect x="212" y="53" width="26" height="26" fill="#eef2f6" stroke="#152e47"/><text x="225" y="72" text-anchor="middle" font-size="17">X</text><path d="M405 100V66" stroke="#152e47" stroke-width="2"/><rect x="392" y="53" width="26" height="26" fill="#eef2f6" stroke="#152e47"/><text x="405" y="72" text-anchor="middle" font-size="17">X</text><path d="M315 175V209" stroke="#152e47" stroke-width="2"/><rect x="302" y="196" width="26" height="26" fill="#eef2f6" stroke="#152e47"/><text x="315" y="215" text-anchor="middle" font-size="17">X</text><path d="M495 175V209" stroke="#152e47" stroke-width="2"/><rect x="482" y="196" width="26" height="26" fill="#eef2f6" stroke="#152e47"/><text x="495" y="215" text-anchor="middle" font-size="17">X</text><text x="330" y="249" text-anchor="middle" font-size="20">Separate linear chains with pendant groups X</text><path d="M20 268H640" stroke="#bbc7d1"/><text x="24" y="320" font-size="25" font-weight="bold">II</text><path d="M180,320H540" stroke="#152e47" stroke-width="3"/><circle cx="180" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="225" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="270" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="315" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="360" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="405" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="450" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="495" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="540" cy="320" r="8" fill="white" stroke="#152e47" stroke-width="2"/><path d="M360 320L393 358L430 397L467 436" fill="none" stroke="#152e47" stroke-width="3"/><circle cx="393" cy="358" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="430" cy="397" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="467" cy="436" r="8" fill="white" stroke="#152e47" stroke-width="2"/><text x="330" y="477" text-anchor="middle" font-size="20">A polymer-chain arm branches from the backbone</text><path d="M20 497H640" stroke="#bbc7d1"/><text x="24" y="550" font-size="25" font-weight="bold">III</text><path d="M180,550H540" stroke="#152e47" stroke-width="3"/><circle cx="180" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="225" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="270" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="315" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="360" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="405" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="450" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="495" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="540" cy="550" r="8" fill="white" stroke="#152e47" stroke-width="2"/><path d="M180,634H540" stroke="#152e47" stroke-width="3"/><circle cx="180" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="225" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="270" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="315" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="360" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="405" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="450" cy="634" r="8" fill="white" stroke="#152e47" stroke-width="2"/><circle cx="4