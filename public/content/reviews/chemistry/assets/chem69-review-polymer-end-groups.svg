<svg xmlns="http://www.w3.org/2000/svg" width="660" height="552" viewBox="0 0 660 552" role="img" aria-labelledby="title desc"><title id="title">Restoring groups at an identified amide link</title><desc id="desc">An identified interunit carbonyl-carbon to nitrogen bond is cut conceptually. OH is restored at carbonyl C and H at N. Structures represented by R and R prime are retained.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#152e47"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#152e47"/></marker></defs>
<text x="330" y="32" text-anchor="middle" font-size="24" font-weight="bold">Identify the interunit link before restoring ends</text>
<text x="100" y="164" text-anchor="middle" font-size="30">R</text><text x="245" y="164" text-anchor="middle" font-size="30">C</text><text x="245" y="84" text-anchor="middle" font-size="30">O</text>
<text x="425" y="164" text-anchor="middle" font-size="30">N</text><text x="425" y="226" text-anchor="middle" font-size="28">H</text><text x="550" y="164" text-anchor="middle" font-size="30">R′</text>
<path d="M124 156H223 M239 137V102 M251 137V102 M268 156H403 M448 156H524 M425 181V201" stroke="#152e47" stroke-width="3" fill="none"/>
<path d="M336 95V213" stroke="#152e47" stroke-width="2" stroke-dasharray="6 5"/>
<text x="336" y="60" text-anchor="middle" font-size="19">Specified new link</text>
<path d="M330 250V294" stroke="#152e47" stroke-width="3" marker-end="url(#arrow)"/>
<text x="330" y="337" text-anchor="middle" font-size="28">R–C(=O)–OH  +  H₂N–R′</text>
<text x="330" y="377" text-anchor="middle" font-size="21">Restore OH to C • restore H to N</text>
<rect x="24" y="405" width="612" height="90" rx="6" fill="#f3f6f8" stroke="#9aa9b8"/>
<text x="330" y="438" text-anchor="middle" font-size="22">A one-type AB precursor has both ends:</text>
<text x="330" y="475" text-anchor="middle" font-size="28">H₂N–R–COOH</text>
<text x="330" y="532" text-anchor="middle" font-size="19">Keep the structure inside each R group unchanged.</text></g></svg>
