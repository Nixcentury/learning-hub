<svg xmlns="http://www.w3.org/2000/svg" width="660" height="675" viewBox="0 0 660 675" role="img" aria-labelledby="title desc">
<title id="title">Bonding pairs and lone pairs in four Lewis diagrams</title>
<desc id="desc">Hydrogen has two shared dots and no lone pairs. Oxygen has two bond lines and two lone pairs on each O. Nitrogen has three bond lines and one lone pair on each N. Water has two single O–H bonds and two lone pairs on O. Each line represents two shared electrons. The diagrams account for valence electrons and are not electron positions or angle measurements.</desc>
<rect width="660" height="675" rx="16" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172d49" text-anchor="middle">
<text x="330" y="35" font-size="27" font-weight="bold">Bonding pairs and lone pairs</text>
<text x="330" y="70" font-size="21" >One line = one shared pair = 2 electrons</text>
<path d="M28 205 H632" stroke="#cad3df" stroke-width="1.3"/>
<path d="M28 330 H632" stroke="#cad3df" stroke-width="1.3"/>
<path d="M28 455 H632" stroke="#cad3df" stroke-width="1.3"/>
<g data-molecule="H2">
<text x="105" y="143" font-size="28" font-weight="bold">H₂</text>
<text x="105" y="177" font-size="21" >Single bond</text>
<g data-atom="H" data-x="350" data-y="150">
<text x="350" y="164" font-size="43" >H</text>
</g>
<g data-atom="H" data-x="440" data-y="150">
<text x="440" y="164" font-size="43" >H</text>
</g>
<circle data-role="shared-electron" cx="395" cy="144" r="4" fill="#172d49"/>
<circle data-role="shared-electron" cx="395" cy="156" r="4" fill="#172d49"/>
</g>
<g data-molecule="O2">
<text x="105" y="264" font-size="28" font-weight="bold">O₂</text>
<text x="105" y="299" font-size="21" >Double bond</text>
<g data-atom="O" data-x="350" data-y="275">
<text x="350" y="289" font-size="43" >O</text>
<circle data-role="lone-electron" cx="310" cy="267" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="310" cy="283" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="342" cy="233" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="358" cy="233" r="4" fill="#172d49"/>
</g>
<g data-atom="O" data-x="440" data-y="275">
<text x="440" y="289" font-size="43" >O</text>
<circle data-role="lone-electron" cx="480" cy="267" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="480" cy="283" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="432" cy="233" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="448" cy="233" r="4" fill="#172d49"/>
</g>
<path data-role="shared-line" d="M374 269 L416 269" stroke="#172d49" stroke-width="2.8"/>
<path data-role="shared-line" d="M374 281 L416 281" stroke="#172d49" stroke-width="2.8"/>
</g>
<g data-molecule="N2">
<text x="105" y="389" font-size="28" font-weight="bold">N₂</text>
<text x="105" y="424" font-size="21" >Triple bond</text>
<g data-atom="N" data-x="350" data-y="400">
<text x="350" y="414" font-size="43" >N</text>
<circle data-role="lone-electron" cx="310" cy="392" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="310" cy="408" r="4" fill="#172d49"/>
</g>
<g data-atom="N" data-x="440" data-y="400">
<text x="440" y="414" font-size="43" >N</text>
<circle data-role="lone-electron" cx="480" cy="392" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="480" cy="408" r="4" fill="#172d49"/>
</g>
<path data-role="shared-line" d="M374 390 L416 390" stroke="#172d49" stroke-width="2.8"/>
<path data-role="shared-line" d="M374 400 L416 400" stroke="#172d49" stroke-width="2.8"/>
<path data-role="shared-line" d="M374 410 L416 410" stroke="#172d49" stroke-width="2.8"/>
</g>
<g data-molecule="H2O">
<text x="112" y="524" font-size="28" font-weight="bold">H₂O</text>
<text x="112" y="558" font-size="20" >2 single bonds</text>
<text x="112" y="589" font-size="20" >2 lone pairs on O</text>
<g data-atom="O" data-x="385" data-y="540">
<text x="385" y="554" font-size="43" >O</text>
<circle data-role="lone-electron" cx="348" cy="500" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="359" cy="510" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="411" cy="510" r="4" fill="#172d49"/>
<circle data-role="lone-electron" cx="422" cy="500" r="4" fill="#172d49"/>
</g>
<g data-atom="H" data-x="308" data-y="599">
<text x="308" y="613" font-size="43" >H</text>
</g>
<g data-atom="H" data-x="462" data-y="599">
<text x="462" y="613" font-size="43" >H</text>
</g>
<path data-role="shared-line" d="M367 554 L328 584" stroke="#172d49" stroke-width="2.8"/>
<path data-role="shared-line" d="M403 554 L442 584" stroke="#172d49" stroke-width="2.8"/>
</g>
<text x="330" y="650" font-size="20" >Lone pairs: pairs of dots outside bonds</text>
</g></svg>
