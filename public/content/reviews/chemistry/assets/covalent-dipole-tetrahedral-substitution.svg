<svg xmlns="http://www.w3.org/2000/svg" width="660" height="635" viewBox="0 0 660 635" role="img" aria-labelledby="title desc">
<title id="title">Tetrahedral CCl4 is nonpolar but tetrahedral CH3Cl is polar</title><desc id="desc">Carbon tetrachloride has four equivalent C-to-Cl bond arrows whose three-dimensional vector sum is zero. Chloromethane replaces three Cl atoms by H. Its C-to-Cl arrow points outward toward Cl, while its weaker H-to-C arrows point inward. These vectors give a nonzero net toward the Cl side. Wedges and dashes indicate depth. All magnitudes are illustrative and are not measured moments or values calculated directly from electronegativity differences.</desc>
<rect width="660" height="635" fill="white"/>
<defs><marker id="bond-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#214f9e"/></marker><marker id="net-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#23654f"/></marker></defs>
<g font-family="Arial, sans-serif">
