<svg xmlns="http://www.w3.org/2000/svg" width="660" height="570" viewBox="0 0 660 570" role="img" aria-labelledby="title desc">
<title id="title">Qualitative potential energy against internuclear separation</title>
<desc id="desc">The zero reference corresponds to widely separated atoms. As atoms approach from far apart, energy falls to a minimum at equilibrium separation. At much shorter separations, repulsion raises energy steeply. The curve approaches zero from below at large separation. No numerical energy or distance scale is implied.</desc>
