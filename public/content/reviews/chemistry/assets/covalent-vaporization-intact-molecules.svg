<svg xmlns="http://www.w3.org/2000/svg" width="660" height="520" viewBox="0 0 660 520" role="img" aria-labelledby="title desc">
<title id="title">Vaporization retains water molecules</title><desc id="desc">Both panels contain six complete water molecules. Each oxygen has two covalent O-H bonds. Liquid molecules are close together; vapor molecules occupy more space. Internal bonds remain in vaporization and condensation. Molecule sizes, distances and densities are schematic; solvent interactions and lone pairs are omitted.</desc>
