<circle cx="215" cy="468" r="18" fill="white" stroke="#20344e" stroke-width="2"/>
<text x="215" y="474" font-size="18" font-weight="bold" text-anchor="middle" fill="#20344e">A</text>
</g>
<text x="410" y="416" font-size="20" font-weight="bold" text-anchor="start" fill="#20344e">AX₆ · e.g. SF₆</text>
<text x="410" y="451" font-size="18" font-weight="normal" text-anchor="start" fill="#20344e">6 equivalent positions</text>
<text x="410" y="481" font-size="18" font-weight="normal" text-anchor="start" fill="#20344e">3 opposite pairs</text>
<text x="410" y="524" font-size="24" font-weight="bold" text-anchor="start" fill="#20344e">90° · 180°</text>
