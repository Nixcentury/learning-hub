<svg xmlns="http://www.w3.org/2000/svg" width="660" height="635" viewBox="0 0 660 635" role="img" aria-labelledby="title desc">
<title id="title">Ideal electron-domain geometries for five and six domains</title><desc id="desc">Five domains form a trigonal bipyramid with two axial positions and three equatorial positions. Axial pairs are 180 degrees apart, equatorial pairs 120 and cross-class pairs 90. Blue denotes axial and green equatorial. Six domains form an octahedron with three opposite pairs and angles 90 or 180; all six positions are equivalent. Solid wedges point out of the page and dashed spokes point behind it. No central lone pairs occur.</desc>
<rect width="660" height="635" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="26" y="35" font-size="25" font-weight="bold" text-anchor="start" fill="#20344e">Basic geometries: 5–6 domains</text>
<text x="26" y="63" font-size="17" font-weight="normal" text-anchor="start" fill="#536273">Ideal angles · no central lone pairs · projected views</text>
<rect x="20" y="86" width="620" height="230" rx="12" fill="#f7f9fc" stroke="#d8e1ed"/>
<text x="36" y="114" font-size="22" font-weight="bold" text-anchor="start" fill="#20344e">5 domains · trigonal bipyramidal</text>
<g data-geometry-domains="5" data-central-lone-pairs="0" data-projection-z="0.65">
<g data-domain="1" data-vx="0" data-vy="1" data-vz="0" data-position="axial" data-screen-x="215.000000" data-screen-y="143.000000">
<line data-depth="page" x1="215" y1="218" x2="215.0" y2="143.0" stroke="#214f9e" stroke-width="3"/>
</g>
