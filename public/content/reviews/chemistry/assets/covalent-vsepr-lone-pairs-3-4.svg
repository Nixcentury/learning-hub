<svg xmlns="http://www.w3.org/2000/svg" width="660" height="775" viewBox="0 0 660 775" role="img" aria-labelledby="title desc">
<title id="title">Lone-pair shapes from three and four total domains</title><desc id="desc">Ozone has two bonded atoms and one central lone pair, with trigonal planar domain geometry and a bent shape. Its compressed bond angle is illustrated below 120 degrees. Ammonia has three bonded atoms and one lone pair, tetrahedral domains and a trigonal pyramidal shape; its bond vectors show about 107 degrees. Water has two bonded atoms and two central lone pairs, tetrahedral domains and a bent shape with bond vectors at 104.5 degrees. Orange paired regions are schematic central lone-pair markers. Terminal lone pairs are omitted.</desc>
<rect width="660" height="775" fill="white"/>
<g font-family="Arial, sans-serif">
<text x="26" y="35" font-size="25" font-weight="bold" text-anchor="start" fill="#20344e">Lone pairs: 3–4 total domains</text>
<text x="26" y="63" font-size="18" font-weight="normal" text-anchor="start" fill="#536273">Orange paired dots = central lone pairs (LP)</text>
<rect x="20" y="86" width="620" height="195" rx="12" fill="#f7f9fc" stroke="#d8e1ed"/>
<text x="36" y="114" font-size="22" font-weight="bold" text-anchor="start" fill="#20344e">O₃ · bent</text>
