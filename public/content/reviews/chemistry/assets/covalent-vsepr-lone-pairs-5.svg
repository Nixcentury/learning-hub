<svg xmlns="http://www.w3.org/2000/svg" width="660" height="820" viewBox="0 0 660 820" role="img" aria-labelledby="title desc">
<title id="title">Molecular shapes derived from five electron domains</title><desc id="desc">Sulfur tetrafluoride has one equatorial lone pair, giving a seesaw shape. Chlorine trifluoride has two equatorial lone pairs and a T shape. Xenon difluoride has three equatorial lone pairs and two opposite axial fluorines, giving a linear shape. All parent positions are ideal trigonal bipyramidal directions. The reference angles are not claims of exact measured angles in SF4 or ClF3. Terminal fluorine lone pairs are omitted.</desc>
<rect width="660" height="820" fill="white"/>
<g font-family="Arial, sans-serif">
