<text x="405" y="528" font-size="20" font-weight="bold" text-anchor="start" fill="#20344e">F–Xe–F: 90° / 180°</text>
<text x="330" y="596" font-size="17" font-weight="normal" text-anchor="middle" fill="#536273">LP guides show domains, not extra bonded atoms.</text>
