<line data-bond-depth="page" x1="215" y1="468" x2="215.0" y2="538.0" stroke="#214f9e" stroke-width="3"/>
</g>
<g data-domain="5" data-kind="lone-pair" data-position="equivalent" data-vx="0" data-vy="0" data-vz="1" data-screen-x="260.500000" data-screen-y="422.500000">
<line data-lp-guide="true" x1="215" y1="468" x2="260.5" y2="422.5" stroke="#a94e16" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="2 5"/>
</g>
<g data-domain="6" data-kind="lone-pair" data-position="equivalent" data-vx="0" data-vy="0" data-vz="-1" data-screen-x="169.500000" data-screen-y="513.500000">
<line data-lp-guide="true" x1="215" y1="468" x2="169.5" y2="513.5" stroke="#a94e16" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="2 5"/>
</g>
<circle data-terminal-atom="1" cx="285.0" cy="468.0" r="15" fill="white" stroke="#214f9e" stroke-width="2"/>
<text x="285.0" y="473.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
<circle data-terminal-atom="2" cx="215.0" cy="398.0" r="15" fill="white" stroke="#214f9e" stroke-width="2"/>
<text x="215.0" y="403.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
<circle data-terminal-atom="3" cx="145.0" cy="468.0" r="15" fill="white" stroke="#214f9e" stroke-width="2"/>
<text x="145.0" y="473.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
