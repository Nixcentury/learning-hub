<text x="145.0" y="223.0" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
<g data-lp-region="4"><ellipse cx="215.0" cy="288.0" rx="16" ry="10" fill="#fff4ea" stroke="#a94e16" stroke-width="1.5"/>
<circle cx="210.0" cy="288.0" r="3" fill="#a94e16"/><circle cx="220.0" cy="288.0" r="3" fill="#a94e16"/>
</g>
<circle data-terminal-atom="5" cx="260.5" cy="172.5" r="15" fill="white" stroke="#214f9e" stroke-width="2"/>
<text x="260.5" y="177.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
<circle data-terminal-atom="6" cx="169.5" cy="263.5" r="15" fill="white" stroke="#214f9e" stroke-width="2"/>
<text x="169.5" y="268.5" font-size="15" font-weight="bold" text-anchor="middle" fill="#214f9e">F</text>
<circle cx="215" cy="218" r="20" fill="white" stroke="#20344e" stroke-width="2"/>
<text x="215" y="224" font-size="16" font-weight="bold" text-anchor="middle" fill="#20344e">Br</text>
</g>
<text x="405" y="164" font-size="20" font-weight="bold" text-anchor="start" fill="#20344e">AX₅E · 6 domains</text>
<text x="405" y="201" font-size="18" font-weight="normal" text-anchor="start" fill="#20344e">Octahedral domains</text>
<text x="405" y="238" font-size="18" font-weight="normal" text-anchor="start" fill="#a94e16">1 central LP</text>
<text x="405" y="278" font-size="20" font-weight="bold" text-anchor="start" fill="#20344e">Ref: 90°, 180°</text>
<rect x="20" y="336" width="620" height="230" rx="12" fill="#f7f9fc" stroke="#d8e1ed"/>
<text x="36" y="364" font-size="22" font-weight="bold" text-anchor="start" fill="#20344e">XeF₄ · square planar</text>
<g data-molecule="XeF4" data-center="Xe" data-terminal="F" data-bonding-domains="4" data-central-lone-pairs="2" data-parent="octahedral" data-angle-kind="ideal-parent" data-center-x="215" data-center-y="468" data-scale="70" data-projection-x="0.65" data-projection-y="0.65">
