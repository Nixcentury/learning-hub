<svg xmlns="http://www.w3.org/2000/svg" width="660" height="350" viewBox="0 0 660 350" role="img" aria-labelledby="title desc" data-hypothetical="true" data-model="{&quot;liquid&quot;:&quot;Hg&quot;,&quot;differenceMm&quot;:40,&quot;atmosphereMmHg&quot;:760}"><title id="title">Mercury manometers</title><desc id="desc">Three model readings with 40 mm mercury level difference: closed vacuum 40 mmHg; open end gas side lower 800 mmHg; open end gas side higher 720 mmHg. Open-end atmosphere is 760 mmHg.</desc><rect width="660" height="350" rx="14" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#20344e"><text x="330" y="28" font-size="22" text-anchor="middle" font-weight="700">Mercury manometers: read the gas-side level</text><text x="330" y="53" font-size="17" text-anchor="middle">Practice data; open-end atmosphere = 760 mmHg</text><g id="case-1" data-gas-level="211" data-other-level="165" data-pressure-mmhg="40"><rect x="8" y="67" width="208" height="271" rx="10" fill="#fff" stroke="#b7c5d5"/><text x="112" y="88" font-size="17" text-anchor="middle" font-weight="700">Closed: vacuum</text><path d="M53 135 V247 Q53 267 73 267 H114 Q134 267 134 247 V135" fill="none" stroke="#647d96" stroke-width="28"/><path d="M53 135 V247 Q53 267 73 267 H114 Q134 267 134 247 V135" fill="none" stroke="white" stroke-width="23"/><path d="M53 211 V247 Q53 267 73 267 H114 Q134 267 134 247 V165" fill="none" stroke="#7f8d9c" stroke-width="20"/><path d="M40 136 V128 A20 20 0 1 1 66 128 V136" fill="#edf3fa" stroke="#647d96" stroke-width="2"/><text x="53" y="119" font-size="16" text-anchor="middle">gas</text><path d="M120 135 H148" stroke="#20344e" stroke-width="3"/><text x="137" y="116" font-size="15" text-anchor="middle">vacuum</text><path d="M150 211 H180" stroke="#657b92" stroke-dasharray="3 3"/><path d="M150 165 H180" stroke="#657b92" stroke-dasharray="3 3"/><path d="M173 165 V211 M168 165 H178 M168 211 H178" stroke="#20344e" stroke-width="1.5"/><text x="172" y="233" font-size="15" text-anchor="middle">40 mm</text><text x="112" y="298" font-size="17" text-anchor="middle">40 mmHg</text><text x="112" y="325" font-size="18" text-anchor="middle" font-weight="700">Pgas = 40 mmHg</text></g><g id="case-2" data-gas-level="211" data-other-level="165" data-pressure-mmhg="800"><rect x="228" y="67" width="208" height="271" rx="10" fill="#fff" stroke="#b7c5d5"/><text x="332" y="88" font-size="17" text-anchor="middle" font-weight="700">Open: gas lower</text><path d="M273 135 V247 Q273 267 293 267 H334 Q354 267 354 247 V135" fill="none" stroke="#647d96" stroke-width="28"/><path d="M273 135 V247 Q273 267 293 267 H334 Q354 267 354 247 V135" fill="none" stroke="white" stroke-width="23"/><path d="M273 211 V247 Q273 267 293 267 H334 Q354 267 354 247 V165" fill="none" stroke="#7f8d9c" stroke-width="20"/><path d="M260 136 V128 A20 20 0 1 1 286 128 V136" fill="#edf3fa" stroke="#647d96" stroke-width="2"/><text x="273" y="119" font-size="16" text-anchor="middle">gas</text><text x="357" y="116" font-size="16" text-anchor="middle">open</text><path d="M370 211 H400" stroke="#657b92" stroke-dasharray="3 3"/><path d="M370 165 H400" stroke="#657b92" stroke-dasharray="3 3"/><path d="M393 165 V211 M388 165 H398 M388 211 H398" stroke="#20344e" stroke-width="1.5"/><text x="392" y="233" font-size="15" text-anchor="middle">40 mm</text><text x="332" y="298" font-size="17" text-anchor="middle">760 + 40 mmHg</text><text x="332" y="325" font-size="18" text-anchor="middle" font-weight="700">Pgas = 800 mmHg</text></g><g id="case-3" data-gas-level="165" data-other-level="211" data-pressure-mmhg="720"><rect x="448" y="67" width="208" height="271" rx="10" fill="#fff" stroke="#b7c5d5"/><text x="552" y="88" font-size="17" text-anchor="middle" font-weight="700">Open: gas higher</text><path d="M493 135 V247 Q493 267 513 267 H554 Q574 267 574 247 V135" fill="none" stroke="#647d96" stroke-width="28"/><path d="M493 135 V247 Q493 267 513 267 H554 Q574 267 574 247 V135" fill="none" stroke="white" stroke-width="23"/><path d="M493 165 V247 Q493 267 513 267 H554 Q574 267 574 247 V211" fill="none" stroke="#7f8d9c" stroke-width="20"/><path d="M480 136 V128 A20 20 0 1 1 506 128 V136" fill="#edf3fa" stroke="#647d96" stroke-width="2"/><text x="493" y="119" font-size="16" text-anchor="middle">gas</text><text x="577" y="116" font-size="16" text-anchor="middle">open</text><path d="M590 165 H620" stroke="#657b92" stroke-dasharray="3 3"/><path d="M590 211 H620" stroke="#657b92" stroke-dasharray="3 3"/><path d="M613 165 V211 M608 165 H618 M608 211 H618" stroke="#20344e" stroke-width="1.5"/><text x="612" y="233" font-size="15" text-anchor="middle">40 mm</text><text x="552" y="298" font-size="17" text-anchor="middle">760 − 40 mmHg</text><text x="552" y="325" font-size="18" text-anchor="middle" font-weight="700">Pgas = 720 mmHg</text></g></g></svg>
