<svg xmlns="http://www.w3.org/2000/svg" width="660" height="680" viewBox="0 0 660 680" role="img" aria-labelledby="title desc" data-hypothetical="true" data-model="{&quot;R&quot;:0.08206,&quot;A&quot;:{&quot;n&quot;:0.02,&quot;P&quot;:0.5},&quot;B&quot;:{&quot;n&quot;:0.04,&quot;P&quot;:2.0},&quot;offset&quot;:273.15,&quot;xSpan&quot;:400,&quot;volumeMax&quot;:1.4}"><title id="title">Same slopes in kelvin and Celsius</title><desc id="desc">Ideal-model A has n 0.020 mol and P 0.50 atm; B has n 0.040 mol and P 2.0 atm. A is twice as steep as B. Shifting the horizontal temperature scale from kelvin to Celsius changes intercepts but not numerical slopes. Dashed portions are extrapolations, not low-temperature measurements.</desc><rect width="660" height="680" rx="14" fill="#f7f9fc"/><g font-family="Arial, sans-serif" fill="#20344e"><text x="330" y="28" font-size="22" text-anchor="middle" font-weight="700">Same gas states, two temperature scales</text><text x="330" y="55" font-size="18" text-anchor="middle">n/P: A = 0.040; B = 0.020 mol/atm</text><g id="temperature-K" data-plot="70,105,600,280" data-xmin="0" data-ymax="1.4"><text x="330" y="81" font-size="19" text-anchor="middle" font-weight="700">Kelvin: the model passes through the origin</text><path d="M70 217.5 H600" stroke="#dce4ee"/><text x="62.0" y="222.5" font-size="15" text-anchor="end">0.5</text><path d="M70 155.0 H600" stroke="#dce4ee"/><text x="62.0" y="160.0" font-size="15" text-anchor="end">1.0</text><path d="M70.0 280 V285" stroke="#20344e"/><text x="70.0" y="303" font-size="15" text-anchor="middle">0</text><path d="M202.5 280 V285" stroke="#20344e"/><text x="202.5" y="303" font-size="15" text-anchor="middle">100</text><path d="M335.0 280 V285" stroke="#20344e"/><text x="335.0" y="303" font-size="15" text-anchor="middle">200</text><path d="M467.5 280 V285" stroke="#20344e"/><text x="467.5" y="303" font-size="15" text-anchor="middle">300</text><path d="M600.0 280 V285" stroke="#20344e"/><text x="600.0" y="303" font-size="15" text-anchor="middle">400</text><path d="M70 280 H600 M70.0 280 V105" stroke="#20344e" stroke-width="1.5" fill="none"/><text x="335.0" y="326" font-size="17" text-anchor="middle">Temperature (K)</text><text x="79.0" y="113" font-size="16" text-anchor="start">V (L)</text><path id="K-A-extrapolated" d="M70.000000 280.000000 L431.923750 167.926555" fill="none" stroke="#244e85" stroke-width="3" stroke-dasharray="7 5"/><path id="K-A-warm" d="M431.923750 167.926555 L600.000000 115.880000" fill="none" stroke="#244e85" stroke-width="3"/><text x="615" y="120.88" font-size="20" text-anchor="middle" font-weight="700" fill="#244e85">A</text><path id="K-B-extrapolated" d="M70.000000 280.000000 L431.923750 223.963278" fill="none" stroke="#95561d" stroke-width="3" stroke-dasharray="7 5"/><path id="K-B-warm" d="M431.923750 223.963278 L600.000000 197.940000" fill="none" stroke="#95561d" stroke-width="3"/><text x="615" y="202.94" font-size="20" text-anchor="middle" font-weight="700" fill="#95561d">B</text></g><g id="temperature-C" data-plot="70,430,600,605" data-xmin="-273.15" data-ymax="1.4"><text x="330" y="406" font-size="19" text-anchor="middle" font-weight="700">Celsius: the intercept shifts; slopes stay the same</text><path d="M70 542.5 H600" stroke="#dce4ee"/><text x="423.9237499999999" y="547.5" font-size="15" text-anchor="end">0.5</text><path d="M70 480.0 H600" stroke="#dce4ee"/><text x="423.9237499999999" y="485.0" font-size="15" text-anchor="end">1.0</text><path d="M70.0 605 V610" stroke="#20344e"/><text x="70.0" y="628" font-size="15" text-anchor="middle">-273.15</text><path d="M299.42375 605 V610" stroke="#20344e"/><text x="299.42375" y="628" font-size="15" text-anchor="middle">-100</text><path d="M431.9237499999999 605 V610" stroke="#20344e"/><text x="431.9237499999999" y="628" font-size="15" text-anchor="middle">0</text><path d="M564.4237499999999 605 V610" stroke="#20344e"/><text x="564.4237499999999" y="628" font-size="15" text-anchor="middle">100</text><path d="M70 605 H600 M431.9237499999999 605 V430" stroke="#20344e" stroke-width="1.5" fill="none"/><text x="335.0" y="651" font-size="17" text-anchor="middle">Temperature (°C)</text><text x="440.9237499999999" y="438" font-size="16" text-anchor="start">V (L)</text><path id="C-A-extrapolated" d="M70.000000 605.000000 L431.923750 492.926555" fill="none" stroke="#244e85" stroke-width="3" stroke-dasharray="7 5"/><path id="C-A-warm" d="M431.923750 492.926555 L600.000000 440.880000" fill="none" stroke="#244e85" stroke-width="3"/><text x="615" y="445.88" font-size="20" text-anchor="middle" font-weight="700" fill="#244e85">A</text><path id="C-B-extrapolated" d="M70.000000 605.000000 L431.923750 548.963278" fill="none" stroke="#95561d" stroke-width="3" stroke-dasharray="7 5"/><path id="C-B-warm" d="M431.923750 548.963278 L600.000000 522.940000" fill="none" stroke="#95561d" stroke-width="3"/><text x="615" y="527.94" font-size="20" text-anchor="middle" font-weight="700" fill="#95561d">B</text></g><text x="330" y="669" font-size="16" text-anchor="middle">Dashed: model extrapolation below 0 °C (273.15 K)</text></g></svg>
