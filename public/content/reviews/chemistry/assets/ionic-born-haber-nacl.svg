<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">NaCl Born–Haber energy paths with grouped steps</title>
  <desc id="desc">Supplied rounded practice data, in kilojoules per mole of NaCl. Elements are assigned relative enthalpy zero. Gaseous atoms are at plus 230, gaseous ions at plus 377, and solid NaCl at minus 411. Atom formation adds 230; ion formation from atoms adds 147; lattice formation subtracts 788. The direct change is minus 411. Steps are grouped as 1 plus 3 and 2 plus 4 from the accompanying table, not a proposed reaction mechanism.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#243e5c"/></marker>
  </defs>
  <rect width="760" height="760" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172d49">
    <text x="380" y="35" text-anchor="middle" font-size="27" font-weight="bold">NaCl: Born–Haber energy paths</text>
    <text x="380" y="68" text-anchor="middle" font-size="20">Practice data · relative enthalpy / kJ mol⁻¹ of NaCl</text>
    <g stroke="#243e5c" stroke-width="2.5" fill="none">
      <path d="M185 396.36 V239.96" marker-end="url(#arrow)"/>
      <path d="M185 239.96 V140" marker-end="url(#arrow)"/>
      <path d="M185 396.36 V675.84" marker-end="url(#arrow)"/>
      <path d="M600 140 V675.84" marker-end="url(#arrow)"/>
    </g>
    <g stroke="#243e5c" stroke-width="3">
      <path data-level="ions" data-enthalpy="377" d="M185 140 H600"/>
      <path data-level="atoms" data-enthalpy="230" d="M185 239.96 H560"/>
      <path data-level="elements" data-enthalpy="0" d="M185 396.36 H560"/>
      <path data-level="crystal" data-enthalpy="-411" d="M185 675.84 H600"/>
    </g>
    <g font-size="24">
      <text x="220" y="119">Na⁺(g) + Cl⁻(g)</text><text x="565" y="119" text-anchor="end">+377</text>
      <text x="220" y="219">Na(g) + Cl(g)</text><text x="550" y="219" text-anchor="end">+230</text>
      <text x="220" y="375">Na(s) + ½Cl₂(g)</text><text x="550" y="375" text-anchor="end">0</text>
      <text x="220" y="655">NaCl(s)</text><text x="565" y="655" text-anchor="end">−411</text>
    </g>
    <g text-anchor="middle">
      <text x="90" y="179" font-size="25" font-weight="bold">+147</text>
      <text x="90" y="209" font-size="20">Steps 2 + 4</text>
      <text x="90" y="302" font-size="25" font-weight="bold">+230</text>
      <text x="90" y="334" font-size="20">Steps 1 + 3</text>
      <text x="90" y="496" font-size="21">Direct</text>
      <text x="90" y="525" font-size="21">formation</text>
      <text x="90" y="566" font-size="26" font-weight="bold">−411</text>
      <text x="675" y="371" font-size="21">Lattice</text>
      <text x="675" y="400" font-size="21">formation</text>
      <text x="675" y="442" font-size="26" font-weight="bold">−788</text>
    </g>
    <text x="380" y="725" text-anchor="middle" font-size="23" font-weight="bold">Grouped route: 230 + 147 − 788 = −411</text>
  </g>
</svg>
