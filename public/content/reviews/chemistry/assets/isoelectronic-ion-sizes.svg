<svg xmlns="http://www.w3.org/2000/svg" width="660" height="305" viewBox="0 0 660 305" role="img"><title>Qualitative radius ordering of ten-electron ions</title><desc>From largest to smallest: N3 minus, O2 minus, F minus, Na plus, Mg2 plus, Al3 plus. Every ion has ten electrons; proton numbers increase from seven to thirteen.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20344e"><text x="330" y="29" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">SAME ELECTRONS · MORE PROTONS → SMALLER</text><text x="330" y="59" text-anchor="middle" font-size="20" font-weight="normal" fill="#20344e">All six ions have 10 electrons: 1s² 2s² 2p⁶</text><circle cx="60" cy="133" r="44" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="60" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">N³⁻</text><text x="60" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=7</text><circle cx="168" cy="133" r="40" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="168" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">O²⁻</text><text x="168" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=8</text><circle cx="276" cy="133" r="36" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="276" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">F⁻</text><text x="276" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=9</text><circle cx="384" cy="133" r="30" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="384" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">Na⁺</text><text x="384" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=11</text><circle cx="492" cy="133" r="26" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="492" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">Mg²⁺</text><text x="492" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=12</text><circle cx="600" cy="133" r="22" fill="#e8f0fc" stroke="#486c9c" stroke-width="2"/><text x="600" y="141" text-anchor="middle" font-size="22" font-weight="bold" fill="#20344e">Al³⁺</text><text x="600" y="206" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">Z=13</text><text x="330" y="250" text-anchor="middle" font-size="24" font-weight="bold" fill="#20344e">N³⁻ &gt; O²⁻ &gt; F⁻ &gt; Na⁺ &gt; Mg²⁺ &gt; Al³⁺</text><text x="330" y="283" text-anchor="middle" font-size="18" font-weight="normal" fill="#20344e">Qualitative ionic sizes · not to scale</text></g></svg>
