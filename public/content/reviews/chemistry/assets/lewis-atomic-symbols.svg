<svg xmlns="http://www.w3.org/2000/svg" width="660" height="724" viewBox="0 0 660 724" role="img" aria-labelledby="title desc">
<title id="title">Lewis symbols of H, He, C, N, O, and Cl</title>
<desc id="desc">The symbols have 1, 2, 4, 5, 6, and 7 dots respectively. Helium is shown with a pair. Other symbols follow the one-per-side-before-pairing convention.</desc>
<rect width="660" height="724" rx="16" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172d49">
<text x="330" y="38" font-size="26" text-anchor="middle" font-weight="bold">Lewis symbols: valence electrons only</text><text x="330" y="70" font-size="22" text-anchor="middle">One dot = one electron</text><rect x="20" y="90" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="170" y="117" font-size="22" text-anchor="middle" font-weight="bold">Hydrogen</text><g id="atom-H"><text x="170" y="196" font-size="52" text-anchor="middle">H</text><circle cx="219" cy="179" r="4.5" fill="#172d49"/></g><text x="170" y="260" font-size="20" text-anchor="middle">1 valence electron</text><rect x="340" y="90" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="490" y="117" font-size="22" text-anchor="middle" font-weight="bold">Helium</text><g id="atom-He"><text x="490" y="196" font-size="52" text-anchor="middle">He</text><circle cx="539" cy="172" r="4.5" fill="#172d49"/><circle cx="539" cy="186" r="4.5" fill="#172d49"/></g><text x="490" y="260" font-size="20" text-anchor="middle">2 valence electrons</text><rect x="20" y="290" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="170" y="317" font-size="22" text-anchor="middle" font-weight="bold">Carbon</text><g id="atom-C"><text x="170" y="396" font-size="52" text-anchor="middle">C</text><circle cx="170" cy="330" r="4.5" fill="#172d49"/><circle cx="219" cy="379" r="4.5" fill="#172d49"/><circle cx="170" cy="428" r="4.5" fill="#172d49"/><circle cx="121" cy="379" r="4.5" fill="#172d49"/></g><text x="170" y="460" font-size="20" text-anchor="middle">4 valence electrons</text><rect x="340" y="290" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="490" y="317" font-size="22" text-anchor="middle" font-weight="bold">Nitrogen</text><g id="atom-N"><text x="490" y="396" font-size="52" text-anchor="middle">N</text><circle cx="483" cy="330" r="4.5" fill="#172d49"/><circle cx="497" cy="330" r="4.5" fill="#172d49"/><circle cx="539" cy="379" r="4.5" fill="#172d49"/><circle cx="490" cy="428" r="4.5" fill="#172d49"/><circle cx="441" cy="379" r="4.5" fill="#172d49"/></g><text x="490" y="460" font-size="20" text-anchor="middle">5 valence electrons</text><rect x="20" y="490" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="170" y="517" font-size="22" text-anchor="middle" font-weight="bold">Oxygen</text><g id="atom-O"><text x="170" y="596" font-size="52" text-anchor="middle">O</text><circle cx="163" cy="530" r="4.5" fill="#172d49"/><circle cx="177" cy="530" r="4.5" fill="#172d49"/><circle cx="219" cy="579" r="4.5" fill="#172d49"/><circle cx="170" cy="628" r="4.5" fill="#172d49"/><circle cx="121" cy="572" r="4.5" fill="#172d49"/><circle cx="121" cy="586" r="4.5" fill="#172d49"/></g><text x="170" y="660" font-size="20" text-anchor="middle">6 valence electrons</text><rect x="340" y="490" width="300" height="184" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="490" y="517" font-size="22" text-anchor="middle" font-weight="bold">Chlorine</text><g id="atom-Cl"><text x="490" y="596" font-size="52" text-anchor="middle">Cl</text><circle cx="483" cy="530" r="4.5" fill="#172d49"/><circle cx="497" cy="530" r="4.5" fill="#172d49"/><circle cx="539" cy="572" r="4.5" fill="#172d49"/><circle cx="539" cy="586" r="4.5" fill="#172d49"/><circle cx="490" cy="628" r="4.5" fill="#172d49"/><circle cx="441" cy="572" r="4.5" fill="#172d49"/><circle cx="441" cy="586" r="4.5" fill="#172d49"/></g><text x="490" y="660" font-size="20" text-anchor="middle">7 valence electrons</text><text x="330" y="706" font-size="20" text-anchor="middle">Dot-placement convention; not an orbital diagram.</text>
</g>
</svg>
