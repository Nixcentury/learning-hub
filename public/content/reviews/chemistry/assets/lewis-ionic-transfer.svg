<svg xmlns="http://www.w3.org/2000/svg" width="660" height="606" viewBox="0 0 660 606" role="img" aria-labelledby="title desc">
<title id="title">Lewis electron accounting for sodium and chlorine</title>
<desc id="desc">Before: Na has one dot and Cl has seven. After: bracketed Na plus has no dots; bracketed Cl minus has eight. Inner-shell electrons are omitted, not removed from the ions.</desc>
<rect width="660" height="606" rx="16" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172d49">
<text x="330" y="38" font-size="26" text-anchor="middle" font-weight="bold">Electron transfer: Na and Cl</text><text x="330" y="70" font-size="20" text-anchor="middle">Only the displayed valence electrons are counted.</text><rect x="20" y="90" width="620" height="200" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="122" font-size="21" text-anchor="start" font-weight="bold">BEFORE</text><g id="before-Na"><text x="170" y="216" font-size="52" text-anchor="middle">Na</text><circle cx="224" cy="199" r="4.5" fill="#172d49"/></g><text x="330" y="216" font-size="32" text-anchor="middle">+</text><g id="before-Cl"><text x="490" y="216" font-size="52" text-anchor="middle">Cl</text><circle cx="483" cy="145" r="4.5" fill="#172d49"/><circle cx="497" cy="145" r="4.5" fill="#172d49"/><circle cx="544" cy="199" r="4.5" fill="#172d49"/><circle cx="483" cy="253" r="4.5" fill="#172d49"/><circle cx="497" cy="253" r="4.5" fill="#172d49"/><circle cx="436" cy="192" r="4.5" fill="#172d49"/><circle cx="436" cy="206" r="4.5" fill="#172d49"/></g><text x="170" y="274" font-size="21" text-anchor="middle">1 dot</text><text x="490" y="274" font-size="21" text-anchor="middle">7 dots</text><text x="330" y="327" font-size="23" text-anchor="middle" font-weight="bold">Transfer one electron</text><path d="M611 300 L611 344" fill="none" stroke="#172d49" stroke-width="3"/><path d="M604 336 L611 344 L618 336" fill="none" stroke="#172d49" stroke-width="3"/><rect x="20" y="355" width="620" height="200" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="388" font-size="21" text-anchor="start" font-weight="bold">AFTER</text><g id="after-Na"><text x="170" y="475" font-size="52" text-anchor="middle">Na</text></g><path d="M120 411 H108 V508 H120 M220 411 H232 V508 H220" fill="none" stroke="#172d49" stroke-width="2.5"/><text x="246" y="419" font-size="26" text-anchor="middle" font-weight="bold">+</text><g id="after-Cl"><text x="490" y="475" font-size="52" text-anchor="middle">Cl</text><circle cx="483" cy="409" r="4.5" fill="#172d49"/><circle cx="497" cy="409" r="4.5" fill="#172d49"/><circle cx="539" cy="451" r="4.5" fill="#172d49"/><circle cx="539" cy="465" r="4.5" fill="#172d49"/><circle cx="483" cy="507" r="4.5" fill="#172d49"/><circle cx="497" cy="507" r="4.5" fill="#172d49"/><circle cx="441" cy="451" r="4.5" fill="#172d49"/><circle cx="441" cy="465" r="4.5" fill="#172d49"/></g><path d="M426 397 H414 V523 H426 M554 397 H566 V523 H554" fill="none" stroke="#172d49" stroke-width="2.5"/><text x="586" y="408" font-size="26" text-anchor="middle" font-weight="bold">−</text><text x="170" y="546" font-size="20" text-anchor="middle">Na⁺: no displayed dots</text><text x="490" y="546" font-size="20" text-anchor="middle">Cl⁻: 8 dots</text><text x="330" y="586" font-size="20" text-anchor="middle">8 dots before = 8 dots after; inner shells omitted.</text>
</g>
</svg>
