<svg xmlns="http://www.w3.org/2000/svg" width="660" height="552" viewBox="0 0 660 552" role="img" aria-labelledby="title desc">
<title id="title">Complete Lewis structures of carbon dioxide and nitrogen</title>
<desc id="desc">CO2 has two double bonds and two lone pairs on each O, for sixteen valence electrons. N2 has a triple bond and one lone pair on each N, for ten valence electrons.</desc>
<rect width="660" height="552" rx="16" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172d49">
<text x="330" y="38" font-size="26" text-anchor="middle" font-weight="bold">Double and triple bonds</text><rect x="20" y="80" width="620" height="210" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="115" font-size="26" text-anchor="start" font-weight="bold">CO₂</text><text x="180" y="187" font-size="52" text-anchor="middle">O</text><text x="330" y="187" font-size="52" text-anchor="middle">C</text><text x="480" y="187" font-size="52" text-anchor="middle">O</text><g id="CO2-bonds"><path d="M211 162 L296 162" fill="none" stroke="#172d49" stroke-width="3"/><path d="M211 178 L296 178" fill="none" stroke="#172d49" stroke-width="3"/><path d="M364 162 L449 162" fill="none" stroke="#172d49" stroke-width="3"/><path d="M364 178 L449 178" fill="none" stroke="#172d49" stroke-width="3"/></g><g id="CO2-lone-pairs"><circle cx="173" cy="122" r="4.5" fill="#172d49"/><circle cx="187" cy="122" r="4.5" fill="#172d49"/><circle cx="173" cy="218" r="4.5" fill="#172d49"/><circle cx="187" cy="218" r="4.5" fill="#172d49"/><circle cx="473" cy="122" r="4.5" fill="#172d49"/><circle cx="487" cy="122" r="4.5" fill="#172d49"/><circle cx="473" cy="218" r="4.5" fill="#172d49"/><circle cx="487" cy="218" r="4.5" fill="#172d49"/></g><text x="330" y="264" font-size="22" text-anchor="middle">8 bonding + 8 lone-pair electrons = 16 total</text><rect x="20" y="310" width="620" height="190" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="346" font-size="26" text-anchor="start" font-weight="bold">N₂</text><text x="260" y="412" font-size="52" text-anchor="middle">N</text><text x="400" y="412" font-size="52" text-anchor="middle">N</text><g id="N2-bonds"><path d="M290 383 L370 383" fill="none" stroke="#172d49" stroke-width="3"/><path d="M290 395 L370 395" fill="none" stroke="#172d49" stroke-width="3"/><path d="M290 407 L370 407" fill="none" stroke="#172d49" stroke-width="3"/></g><g id="N2-lone-pairs"><circle cx="210" cy="388" r="4.5" fill="#172d49"/><circle cx="210" cy="402" r="4.5" fill="#172d49"/><circle cx="450" cy="388" r="4.5" fill="#172d49"/><circle cx="450" cy="402" r="4.5" fill="#172d49"/></g><text x="330" y="474" font-size="22" text-anchor="middle">6 bonding + 4 lone-pair electrons = 10 total</text><text x="330" y="533" font-size="20" text-anchor="middle">Each line = one pair; each dot = one electron.</text>
</g>
</svg>
