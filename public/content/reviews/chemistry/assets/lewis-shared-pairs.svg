<svg xmlns="http://www.w3.org/2000/svg" width="660" height="510" viewBox="0 0 660 510" role="img" aria-labelledby="title desc">
<title id="title">Shared pairs in hydrogen and hydrogen chloride</title>
<desc id="desc">H2 has one shared pair, two electrons total. HCl has one shared pair between H and Cl and three lone pairs on Cl.</desc>
<rect width="660" height="510" rx="16" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172d49">
<text x="330" y="38" font-size="26" text-anchor="middle" font-weight="bold">Bonding pairs and lone pairs</text><text x="330" y="70" font-size="22" text-anchor="middle">A shared pair contains two electrons.</text><rect x="20" y="90" width="620" height="170" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="124" font-size="27" text-anchor="start" font-weight="bold">H₂</text><text x="230" y="182" font-size="52" text-anchor="middle">H</text><text x="430" y="182" font-size="52" text-anchor="middle">H</text><g id="H2-bonding-pair"><circle cx="330" cy="158" r="4.5" fill="#172d49"/><circle cx="330" cy="172" r="4.5" fill="#172d49"/></g><text x="330" y="234" font-size="21" text-anchor="middle">1 shared pair = 2 electrons in the whole molecule</text><rect x="20" y="280" width="620" height="180" rx="12" fill="#f5f8fc" stroke="#6a7f96" stroke-width="1.5"/><text x="42" y="315" font-size="27" text-anchor="start" font-weight="bold">HCl</text><text x="225" y="377" font-size="52" text-anchor="middle">H</text><text x="435" y="377" font-size="52" text-anchor="middle">Cl</text><g id="HCl-bonding-pair"><circle cx="330" cy="353" r="4.5" fill="#172d49"/><circle cx="330" cy="367" r="4.5" fill="#172d49"/></g><g id="HCl-lone-pairs"><circle cx="428" cy="312" r="4.5" fill="#172d49"/><circle cx="442" cy="312" r="4.5" fill="#172d49"/><circle cx="483" cy="353" r="4.5" fill="#172d49"/><circle cx="483" cy="367" r="4.5" fill="#172d49"/><circle cx="428" cy="408" r="4.5" fill="#172d49"/><circle cx="442" cy="408" r="4.5" fill="#172d49"/></g><text x="330" y="445" font-size="22" text-anchor="middle">1 bonding pair + 3 lone pairs on Cl</text><text x="330" y="492" font-size="20" text-anchor="middle">A single bond can also be drawn as one line.</text>
</g>
</svg>
