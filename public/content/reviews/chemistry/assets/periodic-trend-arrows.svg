<svg xmlns="http://www.w3.org/2000/svg" width="660" height="375" viewBox="0 0 660 375" role="img"><title>Directions of common periodic trends</title><desc>Atomic radius generally increases leftwards and downwards. First ionization energy and electronegativity generally increase rightwards and upwards. Electron affinity and melting points require separate checks.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#20344e"><defs><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#315f9d"/></marker><marker id="pink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a13770"/></marker></defs><text x="330" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#20344e">GENERAL PERIODIC TRENDS</text><rect x="146" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="146" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="146" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="191" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="191" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="191" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="236" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="236" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="236" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="281" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="281" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="281" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="326" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="326" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="326" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="371" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="371" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="371" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="416" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="416" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="416" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="461" y="111" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="461" y="154" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><rect x="461" y="197" width="36" height="34" rx="4" fill="#f2f5f8" stroke="#9aaabd"/><path d="M140 86H502" fill="none" stroke="#a13770" stroke-width="5" marker-end="url(#pink)"/><path d="M538 235V116" fill="none" stroke="#a13770" stroke-width="5" marker-end="url(#pink)"/><path d="M500 276H149" fill="none" stroke="#315f9d" stroke-width="5" marker-end="url(#blue)"/><path d="M100 108V232" fill="none" stroke="#315f9d" stroke-width="5" marker-end="url(#blue)"/><text x="324" y="66" text-anchor="middle" font-size="22" font-weight="bold" fill="#a13770">IE₁ / EN generally increase</text><text x="330" y="318" text-anchor="middle" font-size="22" font-weight="bold" fill="#315f9d">Atomic radius generally increases</text><text x="330" y="352" text-anchor="middle" font-size="19" font-weight="normal" fill="#20344e">EA and melting points: check exceptions and data.</text></g></svg>
