<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Alpha, beta-minus and gamma penetration</title>
<desc id="desc">Alpha stops at paper, beta-minus passes paper but stops at sufficiently thick plastic, gamma passes both and is attenuated by thick lead or concrete. Qualitative, not to scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<rect width="760" height="460" fill="white"/>
<g font-family="Arial,sans-serif" fill="#20344e">
<text x="28" y="35" font-size="25" font-weight="bold">Radiation penetration</text>
<text x="28" y="65" font-size="17">Qualitative model — not to scale</text>
<rect x="255" y="125" width="10" height="225" fill="#e1e6ec" stroke="#20344e"/>
<rect x="432" y="125" width="28" height="225" fill="#dae7ed" stroke="#20344e"/>
<rect x="590" y="125" width="90" height="225" fill="#ccd4df" stroke="#20344e"/>
<g font-size="18" text-anchor="middle"><text x="260" y="102">Paper</text><text x="446" y="102">Plastic</text><text x="635" y="102">Thick shield</text><text x="635" y="380">Lead / concrete</text></g>
<g font-size="21" font-weight="bold"><text x="28" y="175">Alpha α</text><text x="28" y="255">Beta β−</text><text x="28" y="335">Gamma γ</text></g>
<g fill="none" stroke="#20344e" stroke-width="4" marker-end="url(#arrow)">
<path d="M143 168H248"/>
<path d="M143 248H424" stroke-dasharray="10 4"/>
<path d="M143 328H583"/>
</g>
<path d="M680 328H735" stroke="#67768a" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#arrow)"/>
<g font-size="16"><text x="278" y="172">Stopped</text><text x="474" y="252">Stopped*</text><text x="474" y="302">Attenuated →</text></g>
<text x="28" y="414" font-size="17">*With sufficient thickness; energy and material matter.</text>
<text x="28" y="444" font-size="17">Gamma shielding reduces intensity; some photons can pass.</text>
</g></svg>