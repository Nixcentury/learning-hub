   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Pure solvent and solution freezing curves</dc:title>
    <dc:date>2026-10-29T08:51:20.618326</dc:date>
    <dc:description>Hypothetical gradual cooling without supercooling. Pure solvent begins freezing at 5.0 degrees Celsius and has a plateau while solid and liquid coexist. Solution A begins at 4.0, then continues cooling while solvent crystals form and the remaining liquid becomes more concentrated. The solution curve endpoint is not its initial freezing point. The horizontal axis is qualitative progress, not measured time or a claim of equal cooling rates.</dc:description>
    <dc:format>image/svg+xml</dc:format>
