<svg xmlns="http://www.w3.org/2000/svg" width="660" height="540" viewBox="0 0 660 540" role="img" aria-labelledby="title desc">
  <title id="title">Six water ligands donate through six oxygen atoms</title>
  <desc id="desc">Connectivity schematic of Cu two plus with six water ligands. Every line connects Cu to an O donor atom. Coordination number is six. Positions, angles, and distances do not represent actual geometry.</desc>
  <rect width="660" height="540" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172d49" text-anchor="middle">
    <text x="330" y="38" font-size="26" font-weight="bold">[Cu(H<tspan baseline-shift="sub" font-size="18">2</tspan>O)<tspan baseline-shift="sub" font-size="18">6</tspan>]<tspan baseline-shift="super" font-size="18">2+</tspan></text>
    <text x="330" y="72" font-size="21">6 water ligands → 6 O donor atoms</text>
    <g stroke="#435d78" stroke-width="3" fill="none">
      <path d="M330 280 L330 142 M330 280 L475 210 M330 280 L475 350 M330 280 L330 418 M330 280 L185 350 M330 280 L185 210"/>
    </g>
    <g fill="#edf5fb" stroke="#435d78" stroke-width="2">
      <circle cx="330" cy="142" r="25"/><circle cx="475" cy="210" r="25"/>
      <circle cx="475" cy="350" r="25"/><circle cx="330" cy="418" r="25"/>
      <circle cx="185" cy="350" r="25"/><circle cx="185" cy="210" r="25"/>
    </g>
    <g font-size="25" font-weight="bold">
      <text x="330" y="151">O</text><text x="475" y="219">O</text>
      <text x="475" y="359">O</text><text x="330" y="427">O</text>
      <text x="185" y="359">O</text><text x="185" y="219">O</text>
    </g>
    <g font-size="21">
      <text x="330" y="108">H₂O</text><text x="531" y="218">H₂O</text>
      <text x="531" y="358">H₂O</text><text x="330" y="464">H₂O</text>
      <text x="129" y="358">H₂O</text><text x="129" y="218">H₂O</text>
    </g>
    <circle cx="330" cy="280" r="47" fill="#fff" stroke="#172d49" stroke-width="3"/>
    <text x="330" y="289" font-size="28" font-weight="bold">Cu<tspan baseline-shift="super" font-size="18">2+</tspan></text>
    <text x="330" y="506" font-size="22" font-weight="bold">Coordination number = 6</text>
    <text x="330" y="531" font-size="18">Connectivity only; not a geometry or bond-length diagram.</text>
  </g>
</svg>
