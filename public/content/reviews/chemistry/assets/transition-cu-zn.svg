<svg xmlns="http://www.w3.org/2000/svg" width="660" height="560" viewBox="0 0 660 560" role="img" aria-labelledby="title desc">
  <title id="title">Cu and Zn: compare the atom and a common cation</title>
  <desc id="desc">Cu has a full 3d subshell in its neutral atom but forms Cu two plus with 3d nine. Zn and its common Zn two plus ion both have full 3d ten subshells. Remove 4s electrons before 3d electrons.</desc>
  <rect width="660" height="560" rx="16" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172d49">
    <text x="28" y="38" font-size="26" font-weight="bold">Atom → common cation</text>
    <text x="28" y="70" font-size="20">For these ions: remove 4s before 3d.</text>
    <rect x="24" y="96" width="612" height="204" rx="12" fill="#edf5fb" stroke="#536e8a" stroke-width="2"/>
    <text x="44" y="130" font-size="25" font-weight="bold">Cu: transition element</text>
    <text x="44" y="175" font-size="23">Cu: [Ar] 3d<tspan baseline-shift="super" font-size="16">10</tspan> 4s<tspan baseline-shift="super" font-size="16">1</tspan></text>
    <path d="M70 190 V218 M63 210 L70 218 L77 210" fill="none" stroke="#172d49" stroke-width="2.5"/>
    <text x="90" y="210" font-size="19">lose one 4s + one 3d electron</text>
    <text x="44" y="254" font-size="23">Cu<tspan baseline-shift="super" font-size="16">2+</tspan>: [Ar] 3d<tspan baseline-shift="super" font-size="16">9</tspan></text>
    <text x="330" y="254" font-size="22" font-weight="bold">partially filled d</text>
    <rect x="24" y="320" width="612" height="204" rx="12" fill="#f7f7f7" stroke="#626d77" stroke-width="2"/>
    <text x="44" y="354" font-size="25" font-weight="bold">Zn: d-block, excluded by this criterion*</text>
    <text x="44" y="399" font-size="23">Zn: [Ar] 3d<tspan baseline-shift="super" font-size="16">10</tspan> 4s<tspan baseline-shift="super" font-size="16">2</tspan></text>
    <path d="M70 414 V442 M63 434 L70 442 L77 434" fill="none" stroke="#172d49" stroke-width="2.5"/>
    <text x="90" y="434" font-size="19">lose two 4s electrons</text>
    <text x="44" y="478" font-size="23">Zn<tspan baseline-shift="super" font-size="16">2+</tspan>: [Ar] 3d<tspan baseline-shift="super" font-size="16">10</tspan></text>
    <text x="330" y="478" font-size="22" font-weight="bold">full d subshell</text>
    <text x="28" y="550" font-size="18">*IUPAC incomplete-d criterion, in ordinary chemistry.</text>
  </g>
</svg>
