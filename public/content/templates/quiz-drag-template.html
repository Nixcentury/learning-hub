<!-- Copy this file, change the set/question IDs, then edit only the content. -->
<article data-learning-activity-content data-activity-version="1" data-activity-id="drag-template-v1" data-activity-kind="quiz" data-quiz-content-version="1" data-quiz-mode="drag-drop">
  <header data-activity-intro data-quiz-intro>
    <h1 data-activity-title data-quiz-title data-th="แม่แบบควิซลากเติม" data-en="Drag-fill quiz template">แม่แบบควิซลากเติม</h1>
  </header>
  <section data-activity-summary data-quiz-summary>
    <h2 data-activity-summary-title data-th="สรุปก่อนทำ" data-en="Before you start">สรุปก่อนทำ</h2>
    <div data-quiz-summary-content>
      <p data-th="ลากคำตอบลงช่อง หรือแตะชิ้นคำตอบแล้วแตะช่อง ตรวจทุกช่องพร้อมกันเมื่อส่งตรวจ" data-en="Drag a piece to a slot, or tap the piece then the slot. Submit to grade all slots together.">ลากคำตอบลงช่อง หรือแตะชิ้นคำตอบแล้วแตะช่อง ตรวจทุกช่องพร้อมกันเมื่อส่งตรวจ</p>
    </div>
  </section>
  <section data-activity-questions data-quiz-questions>
    <!-- Add another article like this for each new question. -->
    <article data-question data-quiz-question data-question-id="instrument-pair" data-question-type="drag-drop" data-drag-reuse="once">
      <header data-question-prompt data-th="จับคู่เครื่องมือกับสิ่งที่วัด" data-en="Match the instrument to what it measures">จับคู่เครื่องมือกับสิ่งที่วัด</header>
      <div data-question-body>
        <!-- Use shared slots once. Translate surrounding spans with data-th/en. -->
        <p><span data-th="วัดกระแสไฟฟ้า:" data-en="Measures current:">วัดกระแสไฟฟ้า:</span> <span data-drop-slot="current" data-label-th="ช่อง A" data-label-en="Slot A" data-answer="ammeter">[A]</span></p>
        <p><span data-th="วัดความต่างศักย์:" data-en="Measures potential difference:">วัดความต่างศักย์:</span> <span data-drop-slot="voltage" data-label-th="ช่อง B" data-label-en="Slot B" data-answer="voltmeter">[B]</span></p>
      </div>
      <ul data-drag-items>
        <li data-item-id="voltmeter" data-th="โวลต์มิเตอร์" data-en="Voltmeter">โวลต์มิเตอร์</li>
        <li data-item-id="ammeter" data-th="แอมมิเตอร์" data-en="Ammeter">แอมมิเตอร์</li>
      </ul>
      <ol data-question-hints hidden>
        <li data-question-hint data-th="นึกถึงหน่วยแอมแปร์และโวลต์" data-en="Think of amperes and volts.">นึกถึงหน่วยแอมแปร์และโวลต์</li>
      </ol>
      <section data-question-solution data-th="แอมมิเตอร์วัดกระแส โวลต์มิเตอร์วัดความต่างศักย์" data-en="An ammeter measures current; a voltmeter measures potential difference." hidden>แอมมิเตอร์วัดกระแส โวลต์มิเตอร์วัดความต่างศักย์</section>
    </article>
  </section>
</article>
