<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tool.css" />
    <link rel="stylesheet" href="../../shared/activity-core.css?v=5b1" />
    <link rel="stylesheet" href="../../shared/print-core.css?v=5b1" />
    <title>Content and print template · Learning Hub</title>
  </head>
  <body
    class="tool-activity"
    data-activity-shell
    data-content-src="../../content/samples/activity-round-5b.html"
  >
    <main class="tool-shell activity-shell">
      <header class="activity-system-bar" data-activity-system-bar>
        <div class="activity-system-identity">
          <span class="tool-icon" aria-hidden="true">✎</span>
          <div>
            <small data-th="Activity Core · รอบ 5B" data-en="Activity Core · Round 5B">
              Activity Core · รอบ 5B
            </small>
            <strong data-th="แม่พิมพ์เนื้อหากลาง" data-en="Shared content template">
              แม่พิมพ์เนื้อหากลาง
            </strong>
          </div>
        </div>

        <div class="activity-system-actions">
          <span class="activity-contract-status is-loading" data-activity-contract-status>
            <span aria-hidden="true">⋯</span>
            <span data-th="กำลังตรวจไฟล์เนื้อหา" data-en="Validating content">กำลังตรวจไฟล์เนื้อหา</span>
          </span>
          <button
            class="activity-print-button is-selector"
            type="button"
            data-print-selection-toggle
            aria-expanded="false"
            aria-controls="activity-print-selection"
            disabled
          >
            <span aria-hidden="true">☑</span>
            <span
              data-print-selection-label
              data-th="เลือกข้อ"
              data-en="Select questions"
            >เลือกข้อ</span>
          </button>
          <button class="activity-print-button is-summary" type="button" data-print-mode="summary" disabled>
            <span aria-hidden="true">▤</span>
            <span data-th="พิมพ์สรุป" data-en="Print summary">พิมพ์สรุป</span>
          </button>
          <button class="activity-print-button is-worksheet" type="button" data-print-mode="worksheet" disabled>
            <span aria-hidden="true">▣</span>
            <span data-th="ปริ้นโจทย์" data-en="Print worksheet">ปริ้นโจทย์</span>
          </button>
          <button class="activity-print-button is-answer" type="button" data-print-mode="answer" disabled>
            <span aria-hidden="true">✓</span>
            <span data-th="ปริ้นเฉลย" data-en="Print answer key">ปริ้นเฉลย</span>
          </button>
        </div>
      </header>

      <section
        class="activity-print-selection"
        id="activity-print-selection"
        data-print-selection-panel
        data-no-print
        hidden
      >
        <div>
          <small data-th="ชุดข้อที่จะพิมพ์" data-en="Questions to print">ชุดข้อที่จะพิมพ์</small>
          <strong data-th="เลือกเฉพาะข้อที่ต้องการ" data-en="Choose only the questions you need">
            เลือกเฉพาะข้อที่ต้องการ
          </strong>
        </div>
        <div class="activity-print-selection-actions">
          <button type="button" data-print-select-all disabled>
            <span data-th="เลือกทั้งหมด" data-en="Select all">เลือกทั้งหมด</span>
          </button>
          <button type="button" data-print-select-none disabled>
            <span data-th="ล้างทั้งหมด" data-en="Clear all">ล้างทั้งหมด</span>
          </button>
        </div>
        <div class="activity-print-question-list" data-print-question-list></div>
      </section>

      <div class="activity-loading" data-activity-loading role="status" aria-live="polite">
        <span aria-hidden="true"></span>
        <p data-th="กำลังดึง HTML เนื้อหา…" data-en="Loading content HTML…">
          กำลังดึง HTML เนื้อหา…
        </p>
      </div>

      <div data-activity-mount></div>

      <p class="tool-note">
        <span aria-hidden="true">◇</span>
        <span
          data-th="รอบนี้ทดสอบสัญญาเนื้อหาและฟอร์มปริ้นเท่านั้น คำถามเป็นตัวอย่างและยังไม่ตรวจคำตอบหรือบันทึกคะแนน"
          data-en="This round tests the content contract and print form only. The sample questions are not checked or saved."
        >รอบนี้ทดสอบสัญญาเนื้อหาและฟอร์มปริ้นเท่านั้น คำถามเป็นตัวอย่างและยังไม่ตรวจคำตอบหรือบันทึกคะแนน</span>
      </p>
    </main>

    <script src="../../shared/learning-hub-tools.js"></script>
    <script src="tool.js"></script>
    <script src="../../shared/print-core.js?v=5b1"></script>
    <script src="../../shared/activity-core.js?v=5b1"></script>
  </body>
</html>
