<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tool.css" />
    <title>Simulation workspace</title>
  </head>
  <body class="tool-simulation">
    <main class="tool-shell">
      <header class="tool-heading">
        <span class="tool-icon" aria-hidden="true">◉</span>
        <div>
          <small data-th="ห้องทดลองตัวอย่าง" data-en="Simulation workspace sample">ห้องทดลองตัวอย่าง</small>
          <h1 data-th="พื้นที่กว้างสำหรับ Simulation" data-en="A wide canvas for simulations">
            พื้นที่กว้างสำหรับ Simulation
          </h1>
        </div>
      </header>

      <section class="blank-canvas">
        <div>
          <span aria-hidden="true">◉</span>
          <h2 data-th="พื้นที่ทดลองยังว่าง" data-en="The lab canvas is empty">พื้นที่ทดลองยังว่าง</h2>
          <p
            data-th="ภายหลังสามารถเสียบ Simulation HTML ที่สร้างใหม่ หรือไฟล์เดิมที่ผ่านการตรวจแล้วลงในหน้าต่างชนิดนี้"
            data-en="Later, a new simulation HTML—or a reviewed legacy file—can be connected to this type of window."
          >
            ภายหลังสามารถเสียบ Simulation HTML ที่สร้างใหม่ หรือไฟล์เดิมที่ผ่านการตรวจแล้วลงในหน้าต่างชนิดนี้
          </p>
        </div>
      </section>

      <p class="tool-note"><span aria-hidden="true">◇</span><span data-th="รอบนี้ยังไม่เชื่อม Virtual Kinetics Lab หรือ Simulation เดิม" data-en="The Virtual Kinetics Lab and legacy simulations are not connected in this round.">รอบนี้ยังไม่เชื่อม Virtual Kinetics Lab หรือ Simulation เดิม</span></p>
    </main>
    <script src="../../shared/learning-hub-tools.js"></script>
    <script src="tool.js"></script>
  </body>
</html>
