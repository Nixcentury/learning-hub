<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f8ff">
  <title>Learning Hub · ออฟไลน์</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: #f4f8ff; color: #172b56; font: 1rem/1.6 system-ui, sans-serif; }
    main { width: min(100%, 30rem); padding: clamp(1.25rem, 5vw, 2rem); border: 1px solid #b5c4dc; border-radius: 1rem; background: #fff; }
    h1 { font-size: clamp(1.45rem, 5vw, 1.9rem); line-height: 1.35; margin: .35rem 0 0; }
    .en { color: #435779; }
    button { margin-top: .6rem; min-height: 44px; padding: .55rem 1.1rem; border: 0; border-radius: .5rem; background: #172b56; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <strong lang="en">Learning Hub</strong>
    <h1>เปิด Hub ไม่ได้ชั่วคราว</h1>
    <div class="en" lang="en">Can't connect to Learning Hub</div>
    <p>เช็กการเชื่อมต่ออินเทอร์เน็ต แล้วลองเปิดหน้านี้อีกครั้ง<br>
      <span class="en" lang="en">Check your connection, then try opening this page again.</span>
    </p>
    <button type="button" id="retry">ลองใหม่ <span lang="en">· Try again</span></button>
  </main>
  <script>document.getElementById("retry").addEventListener("click", () => location.reload());</script>
</body>
</html>
